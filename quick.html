<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>WG · Quick Add</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&family=Special+Elite&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<style>
:root {
  --bg: #0A0A0A;
  --panel: #141414;
  --panel-2: #1c1c1c;
  --red: #CC0000;
  --red-bright: #ee0000;
  --bone: #F5F1E8;
  --copper: #C8922A;
  --copper-dim: #7d5532;
  --green: #4a8050;
  --border: rgba(245, 241, 232, 0.08);
  --border-strong: rgba(245, 241, 232, 0.18);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--bone); font-family: 'Work Sans', sans-serif; }
body {
  min-height: 100vh;
  padding: 24px 18px 32px;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

.header {
  text-align: center;
  margin-bottom: 24px;
}
.eyebrow {
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.25em;
  font-size: 0.78rem;
  color: var(--copper);
  margin-bottom: 6px;
}
.title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.6rem;
  letter-spacing: 0.05em;
  line-height: 1;
}
.tag {
  font-family: 'Special Elite', serif;
  color: var(--copper);
  font-size: 0.92rem;
  margin-top: 4px;
}

/* MIC */
.mic-wrap {
  display: flex;
  justify-content: center;
  margin: 28px 0 18px;
}
.mic-btn {
  width: 200px; height: 200px;
  border-radius: 50%;
  background: var(--red);
  border: 4px solid #2a0000;
  display: flex; align-items: center; justify-content: center;
  font-size: 5.5rem;
  transition: transform 0.1s, background 0.15s;
  box-shadow: 0 0 40px rgba(204,0,0,0.45), inset 0 0 20px rgba(0,0,0,0.35);
  -webkit-user-select: none; user-select: none;
}
.mic-btn:active, .mic-btn.recording {
  transform: scale(0.95);
  background: var(--red-bright);
}
.mic-btn.recording { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 40px rgba(204,0,0,0.45), inset 0 0 20px rgba(0,0,0,0.35); }
  50% { box-shadow: 0 0 80px rgba(204,0,0,0.9), inset 0 0 20px rgba(0,0,0,0.35); }
}

.prompt {
  text-align: center;
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  font-size: 0.85rem;
  color: var(--copper);
  margin-bottom: 14px;
}

/* HEARD/TYPED */
.heard {
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 14px 16px;
  margin-bottom: 12px;
  font-family: 'Special Elite', serif;
  font-size: 1rem;
  min-height: 50px;
  color: rgba(245,241,232,0.85);
}
.heard.empty { color: rgba(245,241,232,0.3); }

/* PARSED */
.parsed-box {
  border: 1px solid var(--copper);
  background: rgba(200,146,42,0.05);
  padding: 14px 16px;
  margin-bottom: 14px;
}
.parsed-box.hide { display: none; }
.parsed-box .label {
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: 0.72rem;
  color: var(--copper);
  margin-bottom: 6px;
}
.parsed-box .target {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.6rem;
  color: var(--red);
  letter-spacing: 0.04em;
  margin-bottom: 8px;
}
.parsed-box .preview {
  font-size: 0.95rem;
  color: var(--bone);
  line-height: 1.4;
}
.parsed-box .preview .meta {
  display: block;
  font-family: 'Oswald', sans-serif;
  font-size: 0.78rem;
  color: var(--copper);
  margin-top: 6px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* DESTINATION GRID */
.dest-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.dest-btn {
  background: var(--panel);
  border: 1px solid var(--border-strong);
  padding: 16px 12px;
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 600;
  font-size: 0.88rem;
  color: var(--bone);
  transition: all 0.15s;
}
.dest-btn:active { transform: scale(0.97); }
.dest-btn.active {
  background: var(--copper);
  border-color: var(--copper);
  color: var(--bg);
}
.dest-btn.cal-btn.active {
  background: var(--red);
  border-color: var(--red);
  color: var(--bone);
}

/* ACTIONS */
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.btn-cancel, .btn-add {
  padding: 16px;
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 700;
  font-size: 0.95rem;
}
.btn-cancel {
  background: var(--panel);
  border: 1px solid var(--border-strong);
}
.btn-add {
  background: var(--red);
  color: var(--bone);
}
.btn-add:active { background: var(--red-bright); }
.btn-add:disabled { opacity: 0.4; background: var(--panel); color: rgba(245,241,232,0.4); }

/* TYPE FALLBACK */
.type-row {
  margin-top: 18px;
  text-align: center;
}
.type-row .divider {
  font-family: 'Special Elite', serif;
  color: rgba(245,241,232,0.4);
  font-size: 0.85rem;
  margin-bottom: 10px;
}
.type-row .divider::before, .type-row .divider::after { content: '— '; }
.type-row textarea {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--border-strong);
  color: var(--bone);
  padding: 12px 14px;
  font-family: 'Work Sans', sans-serif;
  font-size: 0.95rem;
  resize: vertical;
  min-height: 60px;
}
.type-row textarea:focus { outline: none; border-color: var(--red); }

/* CONNECT GOOGLE BAR */
.gauth-bar {
  margin-top: 18px;
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.gauth-status {
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.78rem;
}
.gauth-status .dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  background: rgba(245,241,232,0.3);
}
.gauth-status.ok .dot { background: var(--green); animation: pulseG 2s ease-in-out infinite; }
.gauth-status.bad .dot { background: var(--red); }
@keyframes pulseG { 50% { opacity: 0.4; } }
.gauth-btn {
  background: var(--copper);
  color: var(--bg);
  padding: 8px 14px;
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 700;
  font-size: 0.78rem;
}
.gauth-btn.signout {
  background: transparent;
  color: var(--bone);
  border: 1px solid var(--border-strong);
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(200px);
  background: var(--panel);
  border-left: 4px solid var(--red);
  padding: 12px 22px;
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.82rem;
  z-index: 100;
  transition: transform 0.3s;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  visibility: hidden;
}
.toast.show { transform: translateX(-50%) translateY(0); visibility: visible; }
.toast.ok { border-left-color: var(--green); }
.toast.err { border-left-color: var(--red); }

.heard { outline: none; }
.heard:focus { border-color: var(--copper); }
.heard.empty::before { content: attr(data-placeholder); color: rgba(245,241,232,0.3); font-style: italic; }
.heard.empty { color: transparent; min-height: 50px; }

</style>
</head>
<body>

<div class="header">
  <p class="eyebrow">// QUICK ADD</p>
  <h1 class="title">WOLF'S GARAGE</h1>
  <p class="tag">hold. talk. release.</p>
</div>

<div class="mic-wrap">
  <button class="mic-btn" id="micBtn" aria-label="Press and hold to record">🎤</button>
</div>

<p class="prompt" id="micPrompt">PRESS AND HOLD MIC TO TALK</p>

<div class="heard empty" id="heardText" contenteditable="true" inputmode="text" data-placeholder="your words show up here — tap to edit or add time"></div>

<div class="parsed-box hide" id="parsedBox">
  <div class="label">Adding to</div>
  <div class="target" id="parsedTarget">TO-DO</div>
  <div class="preview" id="parsedPreview"></div>
</div>

<div class="dest-grid">
  <button class="dest-btn active" data-dest="todo">To-Do</button>
  <button class="dest-btn" data-dest="shopping">Shopping</button>
  <button class="dest-btn" data-dest="ongoing">Ongoing</button>
  <button class="dest-btn" data-dest="next_week">Next Week</button>
  <button class="dest-btn cal-btn" data-dest="calendar" style="grid-column: 1 / -1;">📅 Calendar</button>
</div>

<div class="actions">
  <button class="btn-cancel" id="btnCancel">Cancel</button>
  <button class="btn-add" id="btnAdd" disabled>Add</button>
</div>

<div class="type-row">
  <p class="divider">or type</p>
  <textarea id="typeArea" placeholder="Type instead of talking..."></textarea>
</div>

<div class="gauth-bar">
  <span class="gauth-status" id="gauthStatus"><span class="dot"></span><span id="gauthLabel">Not connected to Google Calendar</span></span>
  <button class="gauth-btn" id="gauthBtn">Connect</button>
</div>

<div class="toast" id="toast"></div>

<script>
// === CONFIG ===
const CLIENT_ID = '779171412811-kevrof1r377hjsn6oopv9gv0fn0egbll.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/calendar.events';
const CALENDAR_ID = 'wolfsgaragenw@gmail.com';

// === STATE ===
let currentDest = 'todo';
let currentText = '';
let tokenClient = null;
let accessToken = null;
let recognition = null;
let isRecording = false;

const $ = id => document.getElementById(id);

// === GOOGLE OAUTH ===
function initGoogleAuth() {
  if (!window.google || !window.google.accounts) {
    setTimeout(initGoogleAuth, 200);
    return;
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (resp) => {
      if (resp.error) {
        showToast('Auth failed: ' + resp.error, 'err');
        return;
      }
      accessToken = resp.access_token;
      const expiry = Date.now() + (resp.expires_in * 1000);
      try {
        localStorage.setItem('wgAccessToken', accessToken);
        localStorage.setItem('wgTokenExpiry', expiry.toString());
      } catch(e) {}
      updateAuthUI(true);
      showToast('Google Calendar connected', 'ok');
    }
  });

  // Restore token if not expired
  try {
    const saved = localStorage.getItem('wgAccessToken');
    const expiry = parseInt(localStorage.getItem('wgTokenExpiry') || '0', 10);
    if (saved && expiry > Date.now() + 60000) {
      accessToken = saved;
      updateAuthUI(true);
    } else {
      updateAuthUI(false);
    }
  } catch(e) {
    updateAuthUI(false);
  }
}

function updateAuthUI(connected) {
  const status = $('gauthStatus');
  const label = $('gauthLabel');
  const btn = $('gauthBtn');
  if (connected) {
    status.classList.remove('bad');
    status.classList.add('ok');
    label.textContent = 'Connected · ' + CALENDAR_ID;
    btn.textContent = 'Sign Out';
    btn.classList.add('signout');
  } else {
    status.classList.remove('ok');
    label.textContent = 'Not connected to Google Calendar';
    btn.textContent = 'Connect';
    btn.classList.remove('signout');
  }
}

$('gauthBtn').addEventListener('click', () => {
  if (accessToken) {
    // Sign out
    google.accounts.oauth2.revoke(accessToken, () => {});
    accessToken = null;
    try {
      localStorage.removeItem('wgAccessToken');
      localStorage.removeItem('wgTokenExpiry');
    } catch(e) {}
    updateAuthUI(false);
    showToast('Disconnected', 'ok');
  } else {
    tokenClient.requestAccessToken({ prompt: 'consent' });
  }
});

// === SPEECH RECOGNITION ===
let SRClass = null;

function initSpeech() {
  SRClass = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SRClass) {
    $('micPrompt').textContent = 'VOICE NOT SUPPORTED — TYPE BELOW';
    $('micBtn').style.opacity = '0.4';
    return;
  }
}

const micBtn = $('micBtn');
function startMic() {
  if (!SRClass || isRecording) return;
  isRecording = true;
  micBtn.classList.add('recording');
  $('micPrompt').textContent = 'LISTENING...';

  // Fresh instance every time — guaranteed clean state, no leftover results
  if (recognition) {
    try { recognition.onresult = null; recognition.onerror = null; recognition.onend = null; recognition.abort(); } catch(e) {}
  }
  currentText = '';
  $('heardText').textContent = '';
  $('heardText').classList.add('empty');

  recognition = new SRClass();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onresult = (e) => {
    let finalText = '', interimText = '';
    for (let i = 0; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
      else interimText += e.results[i][0].transcript;
    }
    const combined = (finalText + ' ' + interimText).trim().replace(/\s+/g, ' ');
    if (combined) {
      currentText = combined;
      $('heardText').textContent = combined;
      $('heardText').classList.remove('empty');
      updatePreview();
    }
  };

  recognition.onerror = (e) => {
    if (e.error !== 'no-speech' && e.error !== 'aborted') {
      showToast('Mic error: ' + e.error, 'err');
    }
  };

  recognition.onend = () => {
    if (isRecording) isRecording = false;
  };

  try {
    recognition.start();
  } catch(e) {
    showToast('Mic start failed: ' + e.message, 'err');
    isRecording = false;
    micBtn.classList.remove('recording');
  }
}
function stopMic() {
  if (!isRecording) return;
  isRecording = false;
  micBtn.classList.remove('recording');
  $('micPrompt').textContent = 'CHECK IT, THEN TAP ADD';
  if (recognition) {
    try { recognition.stop(); } catch(e) {}
  }
}

micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startMic(); });
micBtn.addEventListener('touchend',   (e) => { e.preventDefault(); stopMic(); });
micBtn.addEventListener('mousedown',  startMic);
micBtn.addEventListener('mouseup',    stopMic);
micBtn.addEventListener('mouseleave', () => { if (isRecording) stopMic(); });

// === DESTINATION PICKER ===
document.querySelectorAll('.dest-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.dest-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentDest = b.dataset.dest;
    updatePreview();
  });
});

// === TYPE FALLBACK ===
$('typeArea').addEventListener('input', (e) => {
  currentText = e.target.value.trim();
  $('heardText').textContent = currentText || '';
  $('heardText').classList.toggle('empty', !currentText);
  updatePreview();
});

// Make the heard text editable — tap to fix typos or add missing time
$('heardText').addEventListener('input', (e) => {
  const txt = e.target.textContent.trim();
  currentText = txt;
  $('heardText').classList.toggle('empty', !txt);
  // Sync to type fallback area
  $('typeArea').value = txt;
  updatePreview();
});

$('heardText').addEventListener('focus', () => {
  if ($('heardText').classList.contains('empty')) {
    $('heardText').textContent = '';
    $('heardText').classList.remove('empty');
  }
});

$('heardText').addEventListener('blur', () => {
  if (!$('heardText').textContent.trim()) {
    $('heardText').classList.add('empty');
  }
});

// === CALENDAR PARSING ===
const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const WEEKDAYS = ['sun','mon','tue','wed','thu','fri','sat'];

function parseCalendarEvent(text) {
  if (!text) return null;
  let raw = text.trim();
  let cleaned = raw;

  // === DATE ===
  let date = new Date();
  date.setHours(0,0,0,0);
  let dateMatched = false;

  if (/\btomorrow\b/i.test(cleaned)) {
    date.setDate(date.getDate() + 1);
    cleaned = cleaned.replace(/\btomorrow\b/gi, ' ');
    dateMatched = true;
  } else if (/\btoday\b/i.test(cleaned)) {
    cleaned = cleaned.replace(/\btoday\b/gi, ' ');
    dateMatched = true;
  } else {
    const wkMatch = cleaned.match(/\b(next\s+)?(sun|mon|tue|wed|thu|fri|sat)(day|nesday|sday|urday)?\b/i);
    if (wkMatch) {
      const isNext = !!wkMatch[1];
      const targetDay = WEEKDAYS.indexOf(wkMatch[2].toLowerCase().slice(0,3));
      const today = new Date();
      let daysAhead = (targetDay - today.getDay() + 7) % 7;
      if (daysAhead === 0 && !isNext) daysAhead = 7;
      if (isNext && daysAhead < 7) daysAhead += 7;
      date.setTime(today.getTime());
      date.setHours(0,0,0,0);
      date.setDate(date.getDate() + daysAhead);
      cleaned = cleaned.replace(wkMatch[0], ' ');
      dateMatched = true;
    } else {
      const monMatch = cleaned.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})(st|nd|rd|th)?\b/i);
      if (monMatch) {
        const m = MONTHS.indexOf(monMatch[1].toLowerCase().slice(0,3));
        const d = parseInt(monMatch[2], 10);
        const today = new Date();
        let yr = today.getFullYear();
        const candidate = new Date(yr, m, d);
        if (candidate < today) yr++;
        date = new Date(yr, m, d);
        cleaned = cleaned.replace(monMatch[0], ' ');
        dateMatched = true;
      }
    }
  }

  // === TIME ===
  // Handles: "3pm", "3 pm", "3:30pm", "3 p.m.", "3 p m", "15:00", "at 6 p.m.", "6:00 pm", "six pm"
  // Strategy: find time + ampm together, OR digit followed by am/pm hints
  let startHour = null, startMin = 0;
  let timeToken = null;

  // Spell-out numbers (for voice typos like "spend time with all her" → still might say "six pm")
  const SPELL = { one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10, eleven:11, twelve:12 };

  // Pattern 1: digit + optional minutes + ampm (handles "6pm", "6 pm", "6:30 p.m.", "6 p m")
  let tm = cleaned.match(/\b(\d{1,2})(?::(\d{2}))?\s*(a\.?\s?m\.?|p\.?\s?m\.?)\b/i);
  if (tm) {
    let h = parseInt(tm[1], 10);
    const mins = tm[2] ? parseInt(tm[2], 10) : 0;
    const ampm = tm[3].toLowerCase().replace(/[\.\s]/g, '');
    if (ampm === 'pm' && h < 12) h += 12;
    if (ampm === 'am' && h === 12) h = 0;
    startHour = h;
    startMin = mins;
    timeToken = tm[0];
  } else {
    // Pattern 2: spell + ampm ("six pm", "eight a m")
    const tm2 = cleaned.match(/\b(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\s*(a\.?\s?m\.?|p\.?\s?m\.?)\b/i);
    if (tm2) {
      let h = SPELL[tm2[1].toLowerCase()];
      const ampm = tm2[2].toLowerCase().replace(/[\.\s]/g, '');
      if (ampm === 'pm' && h < 12) h += 12;
      if (ampm === 'am' && h === 12) h = 0;
      startHour = h;
      timeToken = tm2[0];
    } else {
      // Pattern 3: 24h "15:00" or "1500" without ampm
      const tm3 = cleaned.match(/\b(\d{1,2}):(\d{2})\b/);
      if (tm3) {
        const h = parseInt(tm3[1], 10);
        const m = parseInt(tm3[2], 10);
        if (h >= 0 && h <= 23 && m >= 0 && m <= 59) {
          startHour = h;
          startMin = m;
          timeToken = tm3[0];
        }
      } else {
        // Pattern 4: bare digit with AM/PM heuristic ("meet sam at 3")
        const tm4 = cleaned.match(/\b(at|by)\s+(\d{1,2})\b/i);
        if (tm4) {
          let h = parseInt(tm4[2], 10);
          if (h >= 1 && h <= 7) h += 12; // assume afternoon
          if (h >= 0 && h <= 23) {
            startHour = h;
            timeToken = tm4[2]; // strip only the number, leave "at" for now
          }
        }
      }
    }
  }

  if (timeToken) {
    cleaned = cleaned.replace(timeToken, ' ');
  }

  // === AGGRESSIVE CLEANUP ===
  // Strip dictation noise: orphan "a.m.", "p.m.", "at", "on", "to", "the" left over
  cleaned = cleaned.replace(/\b(a\.?\s?m\.?|p\.?\s?m\.?)\b/gi, ' ');
  cleaned = cleaned.replace(/\b(at|on|to|the|for)\b/gi, ' ');
  // Strip leading "add" if user said "add X to calendar"
  cleaned = cleaned.replace(/^\s*add\s+/i, ' ');
  // Strip trailing "to calendar" / "to my calendar"
  cleaned = cleaned.replace(/\s+to\s+(my\s+)?calendar\s*$/i, ' ');
  cleaned = cleaned.replace(/\s+calendar\s*$/i, ' ');
  // Collapse whitespace
  cleaned = cleaned.replace(/\s+/g, ' ').trim();
  // Strip dangling punctuation
  cleaned = cleaned.replace(/^[\s\.,;:!?]+|[\s\.,;:!?]+$/g, '');

  let title = cleaned;
  if (!title) {
    // If we stripped everything, fall back to raw without time/date
    title = raw;
  }
  title = title.charAt(0).toUpperCase() + title.slice(1);

  if (startHour === null) {
    return { error: 'no-time', title, dateMatched };
  }

  const start = new Date(date);
  start.setHours(startHour, startMin, 0, 0);
  const end = new Date(start);
  end.setHours(end.getHours() + 1);

  return {
    title,
    start,
    end,
    dateText: start.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }),
    timeText: start.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
  };
}

// === PREVIEW UPDATE ===
function updatePreview() {
  const box = $('parsedBox');
  const target = $('parsedTarget');
  const preview = $('parsedPreview');
  const addBtn = $('btnAdd');

  if (!currentText) {
    box.classList.add('hide');
    addBtn.disabled = true;
    return;
  }

  if (currentDest === 'calendar') {
    target.textContent = '📅 CALENDAR';
    const ev = parseCalendarEvent(currentText);
    if (ev && !ev.error) {
      preview.innerHTML = ev.title +
        '<span class="meta">' + ev.dateText + ' · ' + ev.timeText + ' · 1 hr · wolfsgaragenw@gmail.com</span>';
      addBtn.disabled = false;
    } else if (ev && ev.error === 'no-time') {
      preview.innerHTML = ev.title +
        '<span class="meta" style="color:var(--red);">⚠ No time found — say a specific time like "3pm" or "2:30"</span>';
      addBtn.disabled = true;
    } else {
      preview.innerHTML = '<span style="color:rgba(245,241,232,0.5);">Speak something like: "Meet Sam tomorrow 3pm"</span>';
      addBtn.disabled = true;
    }
  } else {
    target.textContent = currentDest.replace('_', ' ').toUpperCase();
    preview.textContent = currentText.charAt(0).toUpperCase() + currentText.slice(1);
    addBtn.disabled = false;
  }

  box.classList.remove('hide');
}

// === ADD ACTION ===
$('btnAdd').addEventListener('click', async () => {
  if (!currentText) return;
  if (currentDest === 'calendar') {
    await addToCalendar();
  } else {
    addToList();
  }
});

function addToList() {
  const key = 'morning:' + currentDest;
  let list = [];
  try {
    const raw = localStorage.getItem(key);
    if (raw) list = JSON.parse(raw);
  } catch(e) {}
  const text = currentText.charAt(0).toUpperCase() + currentText.slice(1);
  list.push({ text, done: false, ts: Date.now() });
  try { localStorage.setItem(key, JSON.stringify(list)); } catch(e) {}
  showToast('Added to ' + currentDest.replace('_',' ').toUpperCase(), 'ok');
  resetAll();
}

async function addToCalendar() {
  const ev = parseCalendarEvent(currentText);
  if (!ev || ev.error) {
    showToast('Need a time — try "3pm" or "2:30"', 'err');
    return;
  }
  if (!accessToken) {
    showToast('Connect Google first — tap Connect at bottom', 'err');
    return;
  }

  $('btnAdd').disabled = true;
  $('btnAdd').textContent = 'Adding...';

  try {
    const body = {
      summary: ev.title,
      start: { dateTime: ev.start.toISOString(), timeZone: 'America/Los_Angeles' },
      end:   { dateTime: ev.end.toISOString(),   timeZone: 'America/Los_Angeles' }
    };

    const resp = await fetch(
      'https://www.googleapis.com/calendar/v3/calendars/' + encodeURIComponent(CALENDAR_ID) + '/events',
      {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + accessToken,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      }
    );

    if (resp.status === 401) {
      // Token expired — re-auth
      accessToken = null;
      try {
        localStorage.removeItem('wgAccessToken');
        localStorage.removeItem('wgTokenExpiry');
      } catch(e) {}
      updateAuthUI(false);
      showToast('Session expired — reconnect Google', 'err');
      return;
    }

    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error(errText || 'API error ' + resp.status);
    }

    showToast('Added to calendar', 'ok');
    resetAll();
  } catch (err) {
    showToast('Failed: ' + (err.message || 'unknown'), 'err');
  } finally {
    $('btnAdd').textContent = 'Add';
    $('btnAdd').disabled = false;
  }
}

// === CANCEL / RESET ===
$('btnCancel').addEventListener('click', resetAll);

function resetAll() {
  currentText = '';
  $('heardText').textContent = '';
  $('heardText').classList.add('empty');
  $('typeArea').value = '';
  $('parsedBox').classList.add('hide');
  $('btnAdd').disabled = true;
  $('micPrompt').textContent = 'PRESS AND HOLD MIC TO TALK';
}

// === TOAST ===
function showToast(msg, kind) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.remove('ok', 'err');
  if (kind) t.classList.add(kind);
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2600);
}

// === BOOT ===
initSpeech();
window.addEventListener('load', () => {
  setTimeout(initGoogleAuth, 500);
});
</script>
