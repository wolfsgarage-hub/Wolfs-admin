<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0A0A0A">
<title>WG · Quick Add</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&family=Special+Elite&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0A0A0A;color:#F5F1E8;font-family:'Work Sans',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-user-select:none;user-select:none}
.wrap{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px 18px 28px;gap:14px}
.head{text-align:center}
.head .mark{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:.3em;color:#C8922A}
.head h1{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:.08em;margin:4px 0 0;line-height:1}
.head .tag{font-family:'Special Elite',monospace;font-size:12px;color:#C8922A;margin-top:6px}
.mic{width:200px;height:200px;border-radius:50%;background:#CC0000;border:6px solid #2A2520;color:#fff;font-size:80px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:6px 0 4px;transition:transform .1s,background .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
.mic.live{background:#990000;animation:p 1.2s infinite;transform:scale(1.05)}
.mic.prep{background:#666;animation:none}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(204,0,0,.6)}70%{box-shadow:0 0 0 36px rgba(204,0,0,0)}100%{box-shadow:0 0 0 0 rgba(204,0,0,0)}}
.status{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#C8922A;min-height:18px;text-align:center}
.err{color:#CC0000;font-family:'Special Elite',monospace;font-size:13px;text-align:center;max-width:420px;line-height:1.4;padding:0 8px}
.panel{width:100%;max-width:480px;display:none;flex-direction:column;gap:10px}
.panel.show{display:flex}
.heard{background:#1A1A1A;border:1px solid #2A2520;border-radius:4px;padding:12px;font-family:'Special Elite',monospace;font-size:14px;color:#F5F1E8;min-height:44px;line-height:1.4}
.preview{background:#1A1A1A;border:1px solid #C8922A;border-radius:4px;padding:14px}
.preview .lbl{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#C8922A}
.preview .lst{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.08em;color:#CC0000;margin:2px 0 8px;line-height:1}
.preview .txt{font-family:'Work Sans',sans-serif;font-size:18px;line-height:1.3;color:#F5F1E8}
.picker{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.pick{padding:11px 6px;border:1px solid #2A2520;background:transparent;color:#F5F1E8;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:4px;-webkit-tap-highlight-color:transparent}
.pick.on{background:#C8922A;color:#0A0A0A;border-color:#C8922A}
.acts{display:flex;gap:8px}
.btn{flex:1;padding:14px;border:1px solid #2A2520;background:transparent;color:#F5F1E8;font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;border-radius:4px;-webkit-tap-highlight-color:transparent}
.btn:active{background:#2A2520}
.btn-go{background:#CC0000;border-color:#CC0000;color:#fff}
.btn-go:active{background:#990000}
.or{font-family:'Special Elite',monospace;font-size:12px;color:rgba(245,241,232,.4);text-align:center;margin:4px 0 0}
.typed{width:100%;max-width:480px;display:flex;gap:8px}
.typed input{flex:1;background:#1A1A1A;border:1px solid #2A2520;color:#F5F1E8;padding:12px;border-radius:4px;font-family:'Special Elite',monospace;font-size:14px;-webkit-appearance:none;user-select:text;-webkit-user-select:text}
.typed input:focus{outline:none;border-color:#C8922A}
.typed button{padding:0 18px;border:1px solid #CC0000;background:#CC0000;color:#fff;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.15em;cursor:pointer;border-radius:4px;-webkit-tap-highlight-color:transparent}
.big-cta{display:block;width:100%;max-width:480px;padding:20px;background:#0A0A0A;border:2px solid #C8922A;color:#C8922A;font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.18em;text-align:center;text-decoration:none;border-radius:4px;text-transform:uppercase;-webkit-tap-highlight-color:transparent;margin-top:8px}
.big-cta:active{background:#1A1A1A;color:#F5F1E8}
.recent{width:100%;max-width:480px}
.recent .lbl{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#C8922A;margin-bottom:6px}
.item{padding:8px 12px;background:#1A1A1A;border-left:3px solid #CC0000;margin-bottom:5px;font-family:'Special Elite',monospace;font-size:13px;line-height:1.3}
.item .l{color:#C8922A;font-size:10px;letter-spacing:.18em;display:block;margin-bottom:2px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#CC0000;color:#fff;padding:12px 22px;border-radius:4px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.15em;z-index:99;animation:tt 2.5s;text-transform:uppercase;white-space:nowrap}
@keyframes tt{0%{opacity:0;transform:translate(-50%,20px)}10%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
.dbg-toggle{background:none;border:none;color:rgba(245,241,232,.35);font-family:'Special Elite',monospace;font-size:11px;cursor:pointer;text-decoration:underline;padding:6px;margin-top:6px}
.dbg{font-family:'Special Elite',monospace;font-size:10px;color:rgba(245,241,232,.5);text-align:left;margin-top:4px;line-height:1.5;background:#1A1A1A;padding:10px;border-radius:4px;width:100%;max-width:480px;border:1px solid #2A2520;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="mark">// QUICK ADD</div>
    <h1>WOLF'S GARAGE</h1>
    <div class="tag">hold. talk. release.</div>
  </div>

  <button id="mic" class="mic" aria-label="Press and hold to talk">🎤</button>
  <div id="status" class="status">hold to talk</div>
  <div id="err" class="err"></div>

  <div id="panel" class="panel">
    <div id="heard" class="heard"></div>
    <div class="preview">
      <div class="lbl">ADDING TO</div>
      <div id="lst" class="lst">TO-DO</div>
      <div id="txt" class="txt"></div>
    </div>
    <div class="picker">
      <button class="pick" data-l="todo">To-Do</button>
      <button class="pick" data-l="shop">Shopping</button>
      <button class="pick" data-l="ong">Ongoing</button>
      <button class="pick" data-l="nw">Next Week</button>
    </div>
    <div class="acts">
      <button class="btn" id="cancel">Cancel</button>
      <button class="btn btn-go" id="add">Add</button>
    </div>
  </div>

  <div class="or">— or type —</div>
  <div class="typed">
    <input type="text" id="typed-in" placeholder="add eggs to shopping" autocomplete="off" autocapitalize="sentences">
    <button id="typed-go">Add</button>
  </div>

  <a href="https://raw.githack.com/wolfsgarage-hub/Wolfs-admin/main/index.html" class="big-cta">Open Admin →</a>

  <div id="recent" class="recent" style="display:none">
    <div class="lbl">JUST ADDED</div>
    <div id="recent-list"></div>
  </div>

  <button id="dbg-toggle" class="dbg-toggle">show debug</button>
  <div id="dbg" class="dbg" style="display:none"></div>
</div>

<script>
(function(){
  const K={todo:'wga:todo',shop:'wga:shop',ong:'wga:ong',nw:'wga:nw'};
  const L={todo:'TO-DO',shop:'SHOPPING',ong:'ONGOING',nw:'NEXT WEEK'};
  const ADMIN_URL='https://raw.githack.com/wolfsgarage-hub/Wolfs-admin/main/index.html';
  let curL='todo',curT='',rec=null,live=false,added=[],pendingStop=false,pressActive=false;
  const $=id=>document.getElementById(id);
  const get=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}};
  const set=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  const dbgLog=[];
  function dbg(msg){
    dbgLog.unshift(new Date().toLocaleTimeString()+' '+msg);
    if(dbgLog.length>25)dbgLog.pop();
    $('dbg').innerHTML=dbgLog.join('<br>');
  }
  function parse(t){
    let s=(t||'').toLowerCase().trim().replace(/[.!?,;]+$/g,'');
    if(/^(open|go\s+to|launch|switch\s+to)\s+(the\s+)?(admin|garage|wolf'?s\s+garage)$/.test(s)||s==='admin'||s==='garage'){
      return{nav:'admin'};
    }
    const pats=[
      {l:'shop',re:/\s+(to|on|in|for|the)?\s*(the\s+|my\s+)?(shopping|grocery|groceries|grocer|food)(\s+list)?$/i},
      {l:'nw',re:/\s+(to|on|in|for|the)?\s*(the\s+|my\s+)?next[\s-]?week(\s+list)?$/i},
      {l:'ong',re:/\s+(to|on|in|for|the)?\s*(the\s+|my\s+)?(ongoing(\s+projects?)?|projects?)(\s+list)?$/i},
      {l:'todo',re:/\s+(to|on|in|for|the)?\s*(the\s+|my\s+)?(to[\s-]?do)(\s+list)?$/i},
    ];
    let l='todo';
    for(const p of pats){
      const m=s.match(p.re);
      if(m){s=s.slice(0,m.index).trim();l=p.l;break}
    }
    s=s.replace(/^(add|put|throw|drop|remind\s+me\s+to|i\s+need\s+to|i\s+should|don'?t\s+forget\s+to)\s+/i,'');
    if(s.length>0)s=s.charAt(0).toUpperCase()+s.slice(1);
    return{l,t:s.trim()};
  }
  function show(l,t){
    curL=l;curT=t;
    $('lst').textContent=L[l];
    $('txt').textContent=t;
    $('panel').classList.add('show');
    document.querySelectorAll('.pick').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  }
  function hide(){
    $('panel').classList.remove('show');
    curT='';
    $('heard').textContent='';
  }
  function commit(){
    if(!curT)return;
    const items=get(K[curL]);
    items.push({text:curT,done:false,ts:Date.now()});
    set(K[curL],items);
    added.unshift({l:curL,t:curT});
    if(added.length>5)added.pop();
    renderRecent();
    toast('Added to '+L[curL]);
    hide();
    $('status').textContent='hold to talk';
  }
  function renderRecent(){
    const r=$('recent');
    if(!added.length){r.style.display='none';return}
    r.style.display='block';
    $('recent-list').innerHTML=added.map(x=>
      '<div class="item"><span class="l">'+L[x.l]+'</span>'+esc(x.t)+'</div>'
    ).join('');
  }
  function esc(s){return String(s||'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'})[c])}
  function toast(m){
    const t=document.createElement('div');
    t.className='toast';t.textContent=m;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),2500);
  }
  function startMic(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){
      $('err').innerHTML='Voice API not available on this browser.<br>Try Chrome, or use the typed input below.';
      dbg('FAIL: no SpeechRecognition API');
      return;
    }
    if(live){dbg('already live, ignoring');return}
    dbg('creating recognition instance');
    pendingStop=false;
    rec=new SR();
    rec.continuous=false;
    rec.interimResults=true;
    rec.lang='en-US';
    $('mic').classList.add('prep');
    $('status').textContent='preparing mic...';
    $('err').textContent='';
    rec.onstart=()=>{
      live=true;
      $('mic').classList.remove('prep');
      $('mic').classList.add('live');
      $('status').textContent='listening — release to send';
      $('panel').classList.add('show');
      $('heard').textContent='...';
      dbg('onstart: listening');
      // If user already released before start fired, stop immediately
      if(pendingStop){
        dbg('pendingStop set, stopping now');
        try{rec.stop()}catch(e){}
      }
    };
    rec.onresult=e=>{
      let final='',interim='';
      for(let i=0;i<e.results.length;i++){
        if(e.results[i].isFinal)final+=e.results[i][0].transcript;
        else interim+=e.results[i][0].transcript;
      }
      const txt=(final+' '+interim).trim();
      $('heard').textContent=txt;
      dbg('onresult: '+txt.slice(0,60));
    };
    rec.onend=()=>{
      live=false;
      $('mic').classList.remove('live');
      $('mic').classList.remove('prep');
      const heard=$('heard').textContent.trim();
      dbg('onend, heard length='+heard.length);
      if(heard&&heard!=='...'){
        const r=parse(heard);
        if(r.nav==='admin'){
          $('status').textContent='opening admin...';
          dbg('navigating to admin');
          setTimeout(()=>{location.href=ADMIN_URL},400);
          return;
        }
        if(r.t){show(r.l,r.t);$('status').textContent='check it, then tap ADD';}
        else{$('status').textContent="didn't catch that — hold to retry";hide();}
      }else{
        $('status').textContent='hold to talk';
        hide();
      }
    };
    rec.onerror=e=>{
      live=false;
      $('mic').classList.remove('live');
      $('mic').classList.remove('prep');
      dbg('ERROR: '+e.error+(e.message?' / '+e.message:''));
      if(e.error==='no-speech'){
        $('status').textContent="didn't hear you — hold and speak";
      }else if(e.error==='not-allowed'||e.error==='service-not-allowed'){
        $('err').innerHTML='Mic permission denied. Tap the lock icon in Chrome address bar → Permissions → Microphone → Allow. Then reload.';
        $('status').textContent='mic blocked';
      }else if(e.error==='network'){
        $('err').innerHTML='Voice needs internet. Check your connection and try again.';
        $('status').textContent='offline?';
      }else if(e.error==='aborted'){
        $('status').textContent='hold to talk';
      }else{
        $('err').textContent='Voice error: '+e.error;
        $('status').textContent='try again';
      }
    };
    try{
      rec.start();
      dbg('start() called successfully');
    }catch(err){
      $('err').textContent='Could not start mic: '+err.message;
      $('mic').classList.remove('prep');
      $('status').textContent='hold to talk';
      dbg('start() THREW: '+err.message);
    }
  }
  function pressStart(e){
    if(e&&e.preventDefault)e.preventDefault();
    if(pressActive)return;
    pressActive=true;
    dbg('press start');
    if(curT)hide();
    startMic();
  }
  function pressEnd(e){
    if(!pressActive)return;
    pressActive=false;
    if(e&&e.preventDefault)e.preventDefault();
    dbg('press end, live='+live);
    if(live){
      try{rec.stop()}catch(err){dbg('stop err: '+err.message)}
    }else{
      // recognition may not have started yet — flag to stop on start
      pendingStop=true;
    }
  }
  const mic=$('mic');
  // Pointer events (modern, unified)
  if(window.PointerEvent){
    mic.addEventListener('pointerdown',pressStart);
    mic.addEventListener('pointerup',pressEnd);
    mic.addEventListener('pointercancel',pressEnd);
    mic.addEventListener('pointerleave',pressEnd);
  }else{
    // Fallback: touch + mouse
    mic.addEventListener('touchstart',pressStart,{passive:false});
    mic.addEventListener('touchend',pressEnd);
    mic.addEventListener('touchcancel',pressEnd);
    mic.addEventListener('mousedown',pressStart);
    mic.addEventListener('mouseup',pressEnd);
    mic.addEventListener('mouseleave',pressEnd);
  }
  // Prevent context menu on long-press
  mic.addEventListener('contextmenu',e=>e.preventDefault());

  $('add').onclick=commit;
  $('cancel').onclick=()=>{hide();$('status').textContent='hold to talk'};
  document.querySelectorAll('.pick').forEach(b=>{
    b.onclick=()=>{
      curL=b.dataset.l;
      $('lst').textContent=L[curL];
      document.querySelectorAll('.pick').forEach(x=>x.classList.toggle('on',x===b));
    };
  });
  $('typed-go').onclick=()=>{
    const v=$('typed-in').value.trim();
    if(!v)return;
    const r=parse(v);
    if(r.nav==='admin'){location.href=ADMIN_URL;return;}
    if(r.t){show(r.l,r.t);$('status').textContent='check it, then tap ADD';$('typed-in').value='';$('typed-in').blur();}
  };
  $('typed-in').addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();$('typed-go').click()}
  });
  $('dbg-toggle').onclick=()=>{
    const d=$('dbg');
    if(d.style.display==='none'){
      d.style.display='block';
      $('dbg-toggle').textContent='hide debug';
    }else{
      d.style.display='none';
      $('dbg-toggle').textContent='show debug';
    }
  };
  dbg('page loaded, '+location.protocol);
  dbg('SR support: '+!!(window.SpeechRecognition||window.webkitSpeechRecognition));
  dbg('PointerEvent support: '+!!window.PointerEvent);
})();
</script>
</body>
</html>
