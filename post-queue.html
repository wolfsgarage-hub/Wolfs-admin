<style>

  function saveQueueDoc(m, opts) {

       v1.8 (Critical #1): a failed fresh-read used to fall back to rebuilding the WHOLE doc

     bare date "YYYY-MM-DD" is also plausible. new Date("YYYY-MM-DD") parses as UTC midnight,

    var v = map[m.draft.status] || [m.draft.status, "pending"];

  /* ---- card build ---- */

    var hintT = document.createElement("div"); hintT.className = "hint";
    function tagHint() {
      var tags = ti.value.split(/\s+/).filter(function (t) { return t.length; });
      hintT.textContent = tags.length + " tags. House rule: 5, open #wolfsgarage, close #getbackinthegarage.";
    }
    tagHint();
    ti.oninput = function () {
      if (m.busy || isLocked(d)) { return; }
      d.hashtags = ti.value.split(/\s+/).filter(function (t) { return t.length; });
      tagHint(); markDirty(m);
    };
    ft.appendChild(ti); ft.appendChild(hintT); card.appendChild(ft);
    m.els.inputs.push(ti);

    var flagsWrap = document.createElement("div");
    function rebuildFlags() {
      flagsWrap.innerHTML = "";
      (d.flags || []).forEach(function (f) {
        var fl = document.createElement("div"); fl.className = "flag"; fl.textContent = "FLAG: " + f;
        flagsWrap.appendChild(fl);
      });
    }
    m.els.rebuildFlags = rebuildFlags;
    rebuildFlags();
    card.appendChild(flagsWrap);

    var dayline = document.createElement("div"); dayline.className = "field"; dayline.style.display = "none";
    var daylineLabel = document.createElement("label");
    var daylineHint = document.createElement("div"); daylineHint.className = "hint";
    daylineHint.textContent = "Killed and back on the week builder's list. The assembler fills this slot on its next run.";
    dayline.appendChild(daylineLabel); dayline.appendChild(daylineHint);
    card.appendChild(dayline);

    var actions = document.createElement("div"); actions.className = "actions";
    var save = document.createElement("button"); save.className = "btn save"; save.textContent = "SAVE EDITS"; save.disabled = true;
    m.els.save = save;
    save.onclick = function () { persist(m, "Saving edits...", "Edits saved."); };
    var post = document.createElement("button"); post.className = "btn post"; post.textContent = "POST IT";
    post.onclick = function () {
      if (blockIfNotReady(m)) { return; } /* never mutate status when the save cannot start */
      var preSnap = snapshotDraft(m);
      d.status = "approved"; d.kill_reason = null; d.fix_note = null;
      d.refill_requested = false; if (m.els.refillRow) { m.els.refillRow(); }
      if (m.els.reworkRow) { m.els.reworkRow(); } if (m.els.dayMode) { m.els.dayMode(); }
      persist(m, "Approving...", "Approved. Waits for the publisher (Build 1.3).",
        function () { restoreDraft(m, preSnap); });
    };
    var fixb = document.createElement("button"); fixb.className = "btn fixit"; fixb.textContent = "FIX IT";
    var kill = document.createElement("button"); kill.className = "btn kill"; kill.textContent = "KILL IT";
    // TikTok leg tracker (walk-the-shop #2.5): IG is automated, this leg is manual in the
    // TikTok app - one tap records that it got scheduled so the daily close can stop asking.
    var tk = document.createElement("button"); tk.className = "btn fixit";
    function tkLabel() { tk.textContent = d.tiktok_scheduled_at ? "TIKTOK ✓ " + d.tiktok_scheduled_at.slice(5, 10) : "MARK TIKTOK SCHEDULED"; }
    m.els.tiktokLabel = tkLabel;
    tkLabel();
    function tkShow() { tk.style.display = (d.status === "approved" || d.status === "published") ? "" : "none"; }
    tkShow(); m.els.tiktokShow = tkShow;
    tk.onclick = function () {
      if (blockIfNotReady(m)) { return; }
      var preSnap = snapshotDraft(m);
      d.tiktok_scheduled_at = d.tiktok_scheduled_at ? null : new Date().toISOString().slice(0, 16);
      tkLabel();
      persist(m, "Saving TikTok state...", d.tiktok_scheduled_at ? "TikTok leg marked scheduled." : "TikTok mark cleared.",
        function () { restoreDraft(m, preSnap); });
    };
    actions.appendChild(save); actions.appendChild(post); actions.appendChild(fixb); actions.appendChild(kill); actions.appendChild(tk);
    card.appendChild(actions);

    var reasons = document.createElement("div"); reasons.className = "reasons";
    ["WRONG PHOTO", "WEAK CAPTION", "OFF-BRAND", "OTHER"].forEach(function (rz) {
      var b = document.createElement("button"); b.className = "sbtn warn"; b.textContent = rz;
      b.onclick = function () {
        if (blockIfNotReady(m)) { return; }
        var preSnap = snapshotDraft(m);
        var wasLocked = isLocked(d);
        d.status = "killed"; d.kill_reason = rz.toLowerCase(); d.fix_note = null;
        reasons.className = "reasons";
        /* Killing a post is rejecting the POST, not the DAY. If that day is still ahead,
           it goes straight back on the week builder's list - no second tap, no reminder
           for John to carry. Opt out with DON'T REFILL below. v1.8: a draft already on
           Instagram (killed-after-published, or published) never queues a refill - the
           slot it "frees" is not actually free. */
        /* v1.9 (E1): refillDayName, not refillDay - an unreadable slot must not arm a refill
           on the strength of the truthy "UNKNOWN" sentinel. It gets said out loud instead. */
        var day = wasLocked ? null : refillDayName(d);
        var murky = !wasLocked && !day && slotUnparseable(d);
        d.refill_requested = !!day;
        refillRow();
        if (m.els.reworkRow) { m.els.reworkRow(); } if (m.els.dayMode) { m.els.dayMode(); }
        persist(m, "Killing...", day
          ? "Killed. " + day + " goes back on the build list."
          : (murky
            ? "Killed. Its slot would not read, so no refill was queued - check the week builder."
            : "Killed. The assembler learns from the reason."),
          function () { restoreDraft(m, preSnap); });
      };
      reasons.appendChild(b);
    });
    kill.onclick = function () {
      reasons.className = reasons.className === "reasons open" ? "reasons" : "reasons open";
      if (reasons.className === "reasons open") { overConfirm.className = "reasons"; refreshConfirm.className = "reasons"; } /* one confirmation on screen at a time */
    };
    card.appendChild(reasons);

    /* v1.8 (minor): REFRESH THIS POST / START OVER used to render open-by-default on every
       workable card - two more full-width buttons permanently in the thumb path right below
       KILL IT/FIX IT. Collapse them behind a reveal tap, same as KILL IT's reasons. */
    var moreBtn = document.createElement("button"); moreBtn.className = "sbtn morebtn";
    moreBtn.textContent = "MORE - REFRESH / START OVER";
    var rework = document.createElement("div"); rework.className = "reasons";
    moreBtn.onclick = function () {
      rework.className = rework.className === "reasons open" ? "reasons" : "reasons open";
      overConfirm.className = "reasons"; refreshConfirm.className = "reasons";
      if (rework.className === "reasons open") { reasons.className = "reasons"; }
    };
    card.appendChild(moreBtn);

    var refreshBtn = document.createElement("button"); refreshBtn.className = "sbtn";
    refreshBtn.style.cssText = "border-color:#C8922A;color:#C8922A";
    refreshBtn.textContent = "REFRESH THIS POST";
    refreshBtn.onclick = function () {
      /* v1.8 (critical): used to fire doRefresh() immediately with no confirmation and no
         busy-lock until persist() finally ran. Now gated behind the same two-tap confirm
         START OVER already used. */
      refreshConfirm.className = refreshConfirm.className === "reasons open" ? "reasons" : "reasons open";
      if (refreshConfirm.className === "reasons open") { overConfirm.className = "reasons"; reasons.className = "reasons"; }
    };
    var startOverBtn = document.createElement("button"); startOverBtn.className = "sbtn warn";
    startOverBtn.textContent = "START OVER";
    startOverBtn.onclick = function () {
      overConfirm.className = overConfirm.className === "reasons open" ? "reasons" : "reasons open";
      if (overConfirm.className === "reasons open") {
        reasons.className = "reasons"; refreshConfirm.className = "reasons"; /* one confirmation on screen at a time */
        overYes.textContent = "YES - REBUILD " + (refillDayName(d) || "THIS SLOT").toUpperCase();
      }
    };
    rework.appendChild(refreshBtn); rework.appendChild(startOverBtn);
    card.appendChild(rework);

    var refreshConfirm = document.createElement("div"); refreshConfirm.className = "reasons";
    var refreshYes = document.createElement("button"); refreshYes.className = "sbtn warn";
    refreshYes.textContent = "YES - GET NEW PHOTOS";
    refreshYes.onclick = function () { refreshConfirm.className = "reasons"; doRefresh(m); };
    var refreshNo = document.createElement("button"); refreshNo.className = "sbtn";
    refreshNo.textContent = "NOT YET";
    refreshNo.onclick = function () { refreshConfirm.className = "reasons"; };
    refreshConfirm.appendChild(refreshYes); refreshConfirm.appendChild(refreshNo);
    card.appendChild(refreshConfirm);

    var overConfirm = document.createElement("div"); overConfirm.className = "reasons";
    var overYes = document.createElement("button"); overYes.className = "sbtn warn";
    overYes.textContent = "YES - REBUILD THIS SLOT";
    overYes.onclick = function () { doStartOver(m); };
    var overNo = document.createElement("button"); overNo.className = "sbtn";
    overNo.textContent = "NOT YET";
    overNo.onclick = function () { overConfirm.className = "reasons"; };
    overConfirm.appendChild(overYes); overConfirm.appendChild(overNo);
    card.appendChild(overConfirm);

    function reworkRow() {
      var can = canRework(d);
      moreBtn.style.display = can ? "" : "none";
      if (!can) { rework.className = "reasons"; refreshConfirm.className = "reasons"; overConfirm.className = "reasons"; }
    }
    m.els.reworkRow = reworkRow;

    function dayMode() {
      var on = d.status === "killed" && d.refill_requested === true;
      /* v1.8 (important): `note` used to stay visible (with its own live SEND TO REDO PILE
         button) even in day-mode, so a note typed before START OVER could still be sent
         afterward and silently flip the just-killed draft back to status:"fix". Hide it and
         force-close it, along with the kill-reasons row, whenever day-mode is on. */
      [strip, add, fh, fc, ft, actions, flagsWrap, note].forEach(function (el) { el.style.display = on ? "none" : ""; });
      if (on) {
        panel.style.display = "none"; m.sel = -1;
        reasons.className = "reasons"; note.className = "note field";
      } else { buildPanel(m); }
      dayline.style.display = on ? "block" : "none";
      /* v1.9 (E1): a doc written before this version can still carry refill_day:"UNKNOWN",
         so filter the stored value too rather than printing "UNKNOWN - REBUILDING". */
      var stored = (d.refill_day && d.refill_day !== "UNKNOWN") ? d.refill_day : null;
      daylineLabel.textContent = (stored || refillDayName(d) || "THIS SLOT").toUpperCase() + " - REBUILDING";
    }
    m.els.dayMode = dayMode;
    m.els.syncFields = function () { syncFields(m); };

    function doRefresh(mm) {
      var dd = mm.draft;
      if (blockIfNotReady(mm)) { return; }
      if (!canRework(dd)) { setStat(mm, "This one is locked, or too close to its slot to re-roll.", "err"); return; }
      var photos = dd.slides.filter(isPhoto);
      var picks = pickFresh(mm, photos.length || 1);
      if (!picks) { setStat(mm, "No fresh pictures left from that day. Tap + ADD A PICTURE, or run the assembler.", "err"); return; }

      /* v1.8: lock the card the instant the action is confirmed, not only once persist()
         finally runs after this async image-load chain - a second tap while photos are
         loading must not be able to race in and mutate dd.slides mid-refresh. */
      mm.busy = true;
      if (mm.els.card) { mm.els.card.classList.add("busy"); }

      mm._preRefresh = snapshotDraft(mm);
      dd.refresh_history = (dd.refresh_history || []).concat(photos.map(function (s) { return s.source_asset; }));
      dd.refresh_count = (dd.refresh_count || 0) + 1;
      dd.refreshed_at = new Date().toISOString().slice(0, 16);
      dd.needs_caption = true;
      dd.caption_prev = dd.caption;
      dd.flags_prev = dd.flags || [];
      dd.flags = ["REFRESHED " + dd.refreshed_at.slice(0, 10) + " - photos re-rolled from the "
        + shootDateOf(dd) + " shoot; caption is still the old one."];
      dd.refill_requested = false;
      /* v1.8: tiktok_scheduled_at records a real action John took in the TikTok app -
         a photo re-roll on the IG leg has no bearing on that and must not clear it. */
      if (dd.status === "approved") { dd.status = "pending_approval"; }

      var keep = dd.slides.filter(function (s) { return s.kind !== "photo"; });
      dd.slides = picks.map(function (x) {
        return { kind: "photo", file: null, raw_url: null, source_asset: x.id, source_file: x.source_file,
                 crop: { focus_x: 0.5, focus_y: 0.5, zoom: 1.0 }, _dirtyPixels: false };
      }).concat(keep);

      normalizeFormat(mm); mm.sel = -1;
      rebuildStrip(mm); buildPanel(mm); refreshChip(mm);
      mm.els.rebuildFlags(); mm.els.reworkRow(); mm.els.refillRow(); mm.els.tiktokShow(); mm.els.tiktokLabel(); mm.els.dayMode();
      setStat(mm, "New pictures loading...", "ok");

      function abortRefresh(msg) {
        restoreDraft(mm, mm._preRefresh); /* v1.8: restoreDraft now folds in refreshChip/rebuildFlags/syncFields itself */
        mm.busy = false;
        if (mm.els.card) { mm.els.card.classList.remove("busy"); }
        setStat(mm, msg, "err");
      }

      Promise.all(dd.slides.filter(isPhoto).map(function (s) {
        return loadImage(s.source_file + "?v=" + poolBust())
          .then(function (img) { s._img = img; markPixelsDirty(s); })
          .catch(function () { s._loadFailed = true; });
      })).then(function () {
        if (dd.slides.some(function (s) { return s.kind === "photo" && s._loadFailed; })) {
          abortRefresh("Those pictures would not load. Nothing changed.");
          return;
        }
        repaint(mm); markDirty(mm);
        mm.busy = false; /* hand off to persist(), which sets its own busy lock for the write */
        if (mm.els.card) { mm.els.card.classList.remove("busy"); }
        persist(mm, "Re-rolling this post...",
          "New pictures from that day. Caption is still the old one - rewrite it or leave it for the assembler.",
          function () { restoreDraft(mm, mm._preRefresh); }, { rework: true });
      });
    }

    function doStartOver(mm) {
      var dd = mm.draft;
      if (blockIfNotReady(mm)) { return; }
      if (!canRework(dd)) { setStat(mm, "This one is locked, or too close to its slot to rebuild.", "err"); return; }
      var preSnap = snapshotDraft(mm);
      /* v1.8: mirror the kill-reason path's guard - never queue a refill for a slot that
         has no clear day (missing or already past), unlike the old unconditional `true`. */
      /* v1.9 (E1): refillDayName keeps the "UNKNOWN" sentinel out of both refill_requested
         and the persisted refill_day - it used to be written into the queue JSON verbatim. */
      var day = refillDayName(dd);
      var murky = !day && slotUnparseable(dd);
      dd.status = "killed";
      dd.kill_reason = "start over";
      dd.fix_note = null;
      dd.refill_requested = !!day;
      dd.refill_day = day;
      dd.refill_source = "start_over";
      dd.needs_caption = true;
      overConfirm.className = "reasons";
      mm.els.reworkRow(); mm.els.refillRow(); mm.els.tiktokShow(); mm.els.dayMode();
      if (!day) {
        setStat(mm, murky
          ? "No refill queued - that slot's date would not read. Check the week builder."
          : "No refill queued - that slot has no clear day to rebuild for.", "err");
      }
      persist(mm, "Clearing the day...",
        (dd.refill_day || "That slot") + " is back on the build list. Nothing left to review here.",
        function () { restoreDraft(mm, preSnap); }, { rework: true });
    }

    /* refill opt-out - only visible while a refill is actually pending */
    var refill = document.createElement("div"); refill.className = "stat";
    var noRefill = document.createElement("button"); noRefill.className = "sbtn";
    noRefill.textContent = "DON'T REFILL";
    noRefill.onclick = function () {
      if (blockIfNotReady(m)) { return; }
      var preSnap = snapshotDraft(m);
      d.refill_requested = false;
      refillRow();
      if (m.els.reworkRow) { m.els.reworkRow(); } if (m.els.dayMode) { m.els.dayMode(); }
      persist(m, "Clearing...", "That day stays empty until you say otherwise.",
        function () { restoreDraft(m, preSnap); });
    };
    function refillRow() {
      var on = d.status === "killed" && d.refill_requested === true;
      /* .stat is display:none in CSS, so "" would inherit that and hide the row */
      refill.style.display = on ? "block" : "none";
      refill.textContent = on ? "Refill queued for " + (refillDayName(d) || "that day") + ". " : "";
      if (on) { refill.appendChild(noRefill); }
    }
    m.els.refillRow = refillRow;
    refillRow();
    card.appendChild(refill);

    var note = document.createElement("div"); note.className = "note field";
    note.innerHTML = "<label>What should change? (one line back to the assembler)</label>";
    var ni = document.createElement("input"); ni.type = "text";
    var send = document.createElement("button"); send.className = "sbtn"; send.style.marginTop = "8px"; send.textContent = "SEND TO REDO PILE";
    send.onclick = function () {
      if (blockIfNotReady(m)) { return; }
      if (!ni.value.trim()) { setStat(m, "Write the one-liner first.", "err"); return; }
      var preSnap = snapshotDraft(m);
      d.status = "fix"; d.fix_note = ni.value.trim(); d.kill_reason = null;
      d.refill_requested = false; if (m.els.refillRow) { m.els.refillRow(); }
      if (m.els.reworkRow) { m.els.reworkRow(); } if (m.els.dayMode) { m.els.dayMode(); }
      note.className = "note field";
      persist(m, "Sending...", "In the redo pile for the next assembler run.",
        function () { restoreDraft(m, preSnap); });
    };
    note.appendChild(ni); note.appendChild(send);
    fixb.onclick = function () { note.className = note.className.indexOf("open") > -1 ? "note field" : "note field open"; };
    card.appendChild(note);

    /* dayMode() references `note`, so these initial calls must run after note exists -
       reworkRow()/dayMode() are otherwise always called together after every state change. */
    reworkRow();
    dayMode();

    var stat = document.createElement("div"); stat.className = "stat"; m.els.stat = stat;
    card.appendChild(stat);

    refreshChip(m);
    listEl.appendChild(card);
    rebuildStrip(m);
  }

  /* ---- library picker ---- */
  var pickerEl = document.getElementById("picker");
  var pickerGrid = document.getElementById("pickerGrid");
  var pickerTags = document.getElementById("pickerTags");
  var pickerFilter = "all";
  document.getElementById("pickerClose").onclick = function () { pickerEl.className = ""; pickerFor = null; };

  function poolBust() {
    return pool && pool.updated ? encodeURIComponent(pool.updated) : "1";
  }
  function fetchPool() {
    return fetch("data/library-pool.json?v=" + Date.now())
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (p) { pool = p; })
      .catch(function () { pool = null; });
  }
  function openPicker(m) {
    if (!pool || !pool.images || !pool.images.length) {
      setStat(m, "Loading the library list...", "ok");
      fetchPool().then(function () {
        if (pool && pool.images && pool.images.length) { setStat(m, "", ""); openPicker(m); }
        else { setStat(m, "Library list would not load - bad signal, or the assembler needs a run on the laptop.", "err"); }
      });
      return;
    }
    pickerFor = m;
    pickerEl.className = "open";
    window.scrollTo(0, 0);
    buildPickerTags(); buildPickerGrid();
  }
  function buildPickerTags() {
    var tags = ["all"];
    pool.images.forEach(function (x) { if (tags.indexOf(x.tag) < 0) { tags.push(x.tag); } });
    pickerTags.innerHTML = "";
    tags.forEach(function (t) {
      var b = document.createElement("button");
      b.className = "ptag" + (pickerFilter === t ? " on" : "");
      b.textContent = t.toUpperCase();
      b.onclick = function () { pickerFilter = t; buildPickerTags(); buildPickerGrid(); };
      pickerTags.appendChild(b);
    });
  }
  function buildPickerGrid() {
    pickerGrid.innerHTML = "";
    /* v1.9 (High B): the picker used to offer every image in the pool, including ones already
       on another live draft - one tap created a cross-draft collision the save path then had
       to deal with (and used to refuse the whole write over). Filter them out so the collision
       cannot be created. Pictures already on THIS draft are hidden too: adding the same photo
       to a post twice is never what John meant. */
    var used = usedAssetIds(pickerFor ? pickerFor.draft.id : null);
    var onThisDraft = {};
    if (pickerFor) {
      (pickerFor.draft.slides || []).forEach(function (s) {
        if (s.kind === "photo" && s.source_asset) { onThisDraft[s.source_asset] = true; }
      });
    }
    var shown = 0;
    pool.images.forEach(function (x) {
      if (pickerFilter !== "all" && x.tag !== pickerFilter) { return; }
      if (used[x.id] || onThisDraft[x.id]) { return; }
      var img = document.createElement("img");
      img.src = x.thumb + "?v=" + poolBust(); img.loading = "lazy"; img.alt = x.caption || x.id; img.title = x.caption || "";
      img.onclick = function () {
        var m = pickerFor;
        pickerEl.className = ""; pickerFor = null;
        if (m) { addSlide(m, x); }
      };
      pickerGrid.appendChild(img);
      shown++;
    });
    if (!shown) {
      /* an empty grid with no explanation reads as a broken page */
      var empty = document.createElement("div");
      empty.className = "hint";
      empty.style.cssText = "grid-column:1/-1;padding:18px 4px;text-align:center";
      empty.textContent = pickerFilter === "all"
        ? "Every picture in the library is already on a post. Run the assembler to pull in more."
        : "Nothing left under " + pickerFilter.toUpperCase() + " - the rest are already on posts. Try another tag.";
      pickerGrid.appendChild(empty);
    }
  }

  /* ---- boot ---- */
  fetchPool();

  var fontsReady = Promise.all([
    document.fonts.load("84px 'Bebas Neue'"),
    document.fonts.load("500 12px 'Oswald'")
  ]).catch(function () { /* draw anyway */ });

  var staleWarning = null;
  // Audit item 13: read the queue through the proxy, not the CDN. raw.githack ignores
  // the cache-buster and served a stale queue minutes after a push on 2026-07-25 - John
  // would have been approving a draft that no longer matched main. The proxy 'get' is
  // the same fresh path the publisher uses. CDN stays the fallback if the proxy is down.
  callProxy("get", { repo: "Wolfs-admin", branch: "main", path: QUEUE_PATH })
    .then(function (g) {
      if (!g || !g.contentBase64) { throw new Error("proxy returned no content"); }
      return JSON.parse(decodeURIComponent(escape(atob(String(g.contentBase64).replace(/\n/g, "")))));
    })
    .catch(function (e) {
      staleWarning = "Loaded from the CDN, which can lag a minute behind main. Re-check before approving. (" + String(e.message || e).slice(0, 60) + ")";
      /* v1.8 (minor): a bare relative QUEUE_PATH loads the CURRENT PAGE's own branch/host
         data on any non-main preview (e.g. raw.githack for a feature branch), while every
         write in this file still targets branch:"main" through the proxy. Pin the display
         fallback to main explicitly so a branch preview can never show a different queue
         than the one it actually writes to. (This can no longer feed a write either way -
         saveQueueDoc always re-reads through the proxy and never uses this boot-time doc as
         a write base.) */
      return fetch(RAW_BASE + QUEUE_PATH + "?v=" + Date.now())
        .then(function (r) { if (!r.ok) { throw new Error("HTTP " + r.status); } return r.json(); });
    })
    .then(function (doc) {
      if (staleWarning) {
        statusEl.textContent = staleWarning;
        statusEl.style.color = "#C8922A";
      } else {
        statusEl.style.display = "none";
      }
      (doc.drafts || []).forEach(function (draft) {
        draft.slides = draft.slides || [];   // text drafts from the admin app have no slides
        var m = makeModel(draft);
        models.push(m);
        buildCard(m);
      });
      return fontsReady.then(function () {
        var loads = [];
        models.forEach(function (m) {
          m.draft.slides.forEach(function (s) {
            if (s.kind !== "photo") { return; }
            loads.push(loadImage(s.source_file + "?v=1").then(function (img) { s._img = img; }).catch(function (e) { s._loadFailed = true; console.log("source missing, slide stays un-editable: " + e.message); }));
          });
        });
        return Promise.all(loads);
      });
    })
    .then(function () { models.forEach(repaint); })
    .catch(function (e) {
      statusEl.style.display = "block";
      statusEl.textContent = "Could not load the queue (" + e.message + "). Open this page from its raw.githack link, not as a local file.";
    });
})();
</script>
</body>
</html>
