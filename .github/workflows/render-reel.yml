name: Render Reel
# v1.1: treat dispatch values as data, never shell source.

on:
  workflow_dispatch:
    inputs:
      brief:
        description: "Brief JSON (as string)"
        required: true
      output_id:
        description: "Output ID (used for filename)"
        required: true
  repository_dispatch:
    types: [render-reel]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          which ffmpeg

      - name: Determine output ID
        id: prep
        env:
          OUTPUT_ID_INPUT: ${{ github.event.inputs.output_id || github.event.client_payload.output_id }}
        run: |
          OUTPUT_ID="$OUTPUT_ID_INPUT"
          if [ -z "$OUTPUT_ID" ]; then
            OUTPUT_ID="reel-$(date +%s)"
          fi
          # Reject invalid filenames; never silently truncate or rewrite IDs.
          if [[ ! "$OUTPUT_ID" =~ ^[a-zA-Z0-9_-]{1,64}$ ]]; then
            echo "::error::Output ID must contain 1-64 letters, numbers, dashes, or underscores."
            exit 1
          fi
          printf 'output_id=%s\n' "$OUTPUT_ID" >> "$GITHUB_OUTPUT"
          printf 'Using output ID: %s\n' "$OUTPUT_ID"

      - name: Write brief
        env:
          BRIEF_INPUT: ${{ github.event.inputs.brief }}
          BRIEF_PAYLOAD: ${{ toJSON(github.event.client_payload.brief) }}
        run: |
          mkdir -p /tmp/wgreel renders
          if [ -n "$BRIEF_INPUT" ]; then
            echo "$BRIEF_INPUT" > /tmp/wgreel/brief.json
          else
            echo "$BRIEF_PAYLOAD" > /tmp/wgreel/brief.json
          fi
          echo "--- brief.json (first 60 lines) ---"
          head -60 /tmp/wgreel/brief.json
          echo "---"
          python3 -c "import json; json.load(open('/tmp/wgreel/brief.json'))"
          echo "Brief is valid JSON"

      - name: Render reel
        env:
          OUTPUT_ID: ${{ steps.prep.outputs.output_id }}
        run: |
          python3 scripts/render_reel.py \
            --brief /tmp/wgreel/brief.json \
            --output "renders/$OUTPUT_ID.mp4"
          ls -lh renders/

      - name: Commit and push result
        env:
          OUTPUT_ID: ${{ steps.prep.outputs.output_id }}
        run: |
          git config user.name "Wolf's Garage Render Bot"
          git config user.email "noreply@wolfsgarage.com"
          git add -- "renders/$OUTPUT_ID.mp4"
          git commit -m "render: $OUTPUT_ID"
          # Retry push to handle concurrent updates
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to push after 5 attempts"
          exit 1

      - name: Output URL
        env:
          OUTPUT_ID: ${{ steps.prep.outputs.output_id }}
        run: |
          URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/renders/$OUTPUT_ID.mp4"
          echo "Render URL: $URL"
          echo "::notice::Render complete: $URL"
