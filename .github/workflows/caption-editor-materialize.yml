name: Materialize reviewed caption repair
on:
  push:
    branches: [repair/caption-scroll-voice-v39-1]
    paths:
      - .github/workflows/caption-editor-materialize.yml
permissions:
  contents: read
jobs:
  verify-and-materialize:
    if: github.repository == 'wolfsgarage-hub/Wolfs-admin' && github.ref == 'refs/heads/repair/caption-scroll-voice-v39-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Complete version metadata in the reviewed assembler
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/caption-editor-v39-1.cjs')
          s=p.read_text()
          old='  for(const [name,content] of Object.entries(files))fs.writeFileSync(path.join(root,name),content);'
          new="  files['tests/instagram-workflow-v39.test.cjs']=fs.readFileSync(path.join(root,'tests/instagram-workflow-v39.test.cjs'),'utf8').replace('v39\\\\.0\\\\.0','v39\\\\.1\\\\.0');\n"+old
          if "files['tests/instagram-workflow-v39.test.cjs']" not in s:
              assert s.count(old)==1
              p.write_text(s.replace(old,new))
          PY
          node scripts/caption-editor-v39-1.cjs
      - name: Require byte-for-byte match with tested source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected={
            'index.html':'4a8479b92626357b0235e52f322c2afc886340ebdad667f878fb0b711926b70c',
            'social-queue.html':'4422060b5e7e92ee3a1895108a447deec7e9b42a1ee8a69d0c660feb30d75035',
            'scripts/assemble-studio-v39.cjs':'8983d35e1f67e1496afd2e96145c1d7a9ef9723372a22fe1128e78f5d45c91f9',
            'scripts/caption-editor-v39-1.cjs':'9ec72551ffd118505adb930f6c1affa0cfc4e6fc9d66e8d8abe9ef947c243ec4',
            'scripts/test-social-queue.mjs':'7c0e6cacb595a8d7f9e69172e5793316b436cc739ede1fde32df9e019f3d5f5a',
            'tests/instagram-workflow-v39.test.cjs':'8baf54cbaf377ca436f3e2e7b9dd8e4aeff8f629cf59fe5a92d756de72e758e7',
            'tests/caption-editor-v39-1.browser.cjs':'3df6a0d05dbe45ffd0fbfdfa7e32ae57bbf391709bfc774caa6d43792149969c'
          }
          for name,expected_hash in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected_hash,name
              print('VERIFIED',name)
          PY
      - name: Install isolated test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/caption-tests" --ignore-scripts --no-audit --no-fund playwright@1.64.1 linkedom@0.18.12
          "$RUNNER_TEMP/caption-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Syntax, retained tests and actual browser interactions
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/caption-tests/node_modules"
          node --check scripts/caption-editor-v39-1.cjs
          node scripts/check-inline.mjs index.html social-queue.html
          node --test scripts/test-social-queue.mjs tests/instagram-workflow-v39.test.cjs
          node tests/studio-repair-v39.test.cjs
          node scripts/assemble-studio-v39.cjs > "$RUNNER_TEMP/assembled-caption.html"
          cmp index.html "$RUNNER_TEMP/assembled-caption.html"
          WG_TEST_REPORT="$RUNNER_TEMP/caption-browser-report.json" node tests/caption-editor-v39-1.browser.cjs
          cat "$RUNNER_TEMP/caption-browser-report.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit only the verified repair to its branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/repair/caption-scroll-voice-v39-1
          git diff --check
          git add index.html social-queue.html scripts/assemble-studio-v39.cjs scripts/caption-editor-v39-1.cjs scripts/test-social-queue.mjs tests/instagram-workflow-v39.test.cjs
          git config user.name 'Wolf Garage Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'v39.1: reachable caption editing and unforced caption voice, tested'
          askpass="$RUNNER_TEMP/wg-caption-askpass.sh"
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/repair/caption-scroll-voice-v39-1
