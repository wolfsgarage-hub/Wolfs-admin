<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="wg-version" content="1.0">
<meta name="robots" content="noindex,nofollow">
<title>WG Social Queue v1.0</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--red:#CC0000;--red-dim:#7a0000;--bone:#F5F1E8;--bone-dim:#b8b3a6;--copper:#C8922A;--panel:#141414;--panel-2:#1c1c1c;--border:rgba(245,241,232,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--bone);font-family:'Work Sans',sans-serif;font-size:15px;line-height:1.5;padding-bottom:60px}
.pin{height:3px;background:repeating-linear-gradient(90deg,var(--red) 0 16px,transparent 16px 20px,var(--bone) 20px 23px,transparent 23px 27px)}
header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto}
header .brand{display:flex;align-items:center;gap:12px}
header img{height:40px}
h1{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;letter-spacing:.08em}
h1 span{color:var(--red)}
main{padding:12px 16px;max-width:1100px;margin:0 auto}
.strip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 4px}
.slot{position:relative;background:var(--panel);border:1px solid var(--border);padding:6px 10px;font-family:'Oswald',sans-serif;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.slot b{display:block;color:var(--bone);font-size:.9rem;font-weight:400}
.slot.today{border-color:var(--red)}
.slot .why{display:none;position:absolute;left:0;top:100%;z-index:20;width:300px;background:var(--panel-2);border:1px solid var(--copper);padding:10px 12px;font-family:'Work Sans',sans-serif;font-size:.8rem;text-transform:none;letter-spacing:0;color:var(--bone);line-height:1.45;white-space:normal}
.slot.open .why{display:block}
.stat{background:var(--panel);border:1px solid var(--border);padding:6px 12px;font-size:.78rem;font-family:'Oswald',sans-serif;letter-spacing:.06em;text-transform:uppercase}
.stat b{color:var(--red);font-size:1rem;font-weight:400}
.stat.ok b{color:var(--bone)}
#tick{color:var(--copper);font-size:.74rem;font-family:'Oswald',sans-serif;letter-spacing:.06em;text-transform:uppercase;margin-left:auto}
#banner{display:none;margin:10px 0;padding:12px 14px;background:var(--red);color:var(--bone);font-family:'Oswald',sans-serif;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase}
#banner.on{display:block}
#demoBar{display:none;margin:10px 0 0;padding:8px 12px;border:1px solid var(--copper);color:var(--copper);font-family:'Oswald',sans-serif;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase}
#demoBar.on{display:block}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.tab{font-family:'Oswald',sans-serif;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;padding:9px 14px;border:1px solid var(--border);background:none;color:var(--bone);cursor:pointer}
.tab.on{background:var(--red);border-color:var(--red)}
.pane{display:none}
.pane.on{display:block}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:1024px){.cols{grid-template-columns:420px 1fr;align-items:start}#detailCol{position:sticky;top:12px}}
.card{background:var(--panel-2);border:1px solid var(--border);border-left:4px solid var(--red);padding:12px;margin-bottom:10px;display:grid;grid-template-columns:72px 1fr;gap:10px;cursor:pointer}
.card.sel{outline:1px solid var(--copper)}
.card.approved{border-left-color:var(--bone)}
.card.drag{opacity:.4}
.card.over{outline:2px dashed var(--copper)}
.card img{width:72px;height:90px;object-fit:cover;display:block;background:#000}
.ct{font-family:'Bebas Neue',sans-serif;font-size:1.15rem;letter-spacing:.04em;line-height:1.1}
.cm{font-family:'Oswald',sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--copper);margin:3px 0}
.chip{display:inline-block;font-size:.66rem;font-family:'Oswald',sans-serif;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--copper);color:var(--copper);padding:2px 7px;margin:2px 4px 2px 0}
.chip.bad{border-color:var(--red);color:var(--red)}
.chip.bone{border-color:var(--bone);color:var(--bone)}
.chip.dim{border-color:var(--border);color:var(--bone-dim)}
.handle{font-family:'Oswald',sans-serif;color:var(--bone-dim);cursor:grab;font-size:1.1rem;line-height:1;user-select:none}
.row{margin:8px 0;font-size:.88rem}
.row a{color:var(--copper)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button.act{font-family:'Oswald',sans-serif;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;padding:10px 14px;border:1px solid var(--border);background:none;color:var(--bone);cursor:pointer}
button.act.primary{background:var(--red);border-color:var(--red)}
button.act.kill{border-color:var(--red);color:var(--red)}
button.act.copper{border-color:var(--copper);color:var(--copper)}
button.act:disabled{opacity:.4}
.detail{background:var(--panel-2);border:1px solid var(--border);padding:14px}
.slides{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.slide{position:relative;flex:0 0 200px}
.slide img{width:200px;display:block;background:#000}
.slide .tier{position:absolute;left:6px;top:6px}
.slide .btns{margin-top:6px}
.field{margin:12px 0}
.field label{display:block;font-family:'Oswald',sans-serif;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--copper);margin-bottom:4px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid var(--border);margin-bottom:6px;cursor:pointer;font-size:.9rem}
.opt input{margin-top:4px;accent-color:var(--red)}
.opt .reg{font-family:'Oswald',sans-serif;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--copper);display:block}
textarea,input[type=text],input[type=date],select{width:100%;padding:8px 10px;background:rgba(0,0,0,.5);border:1px solid var(--border);color:var(--bone);font-family:'Work Sans',sans-serif;font-size:.9rem}
textarea{min-height:90px;resize:vertical}
.hint{font-size:.76rem;color:var(--bone-dim);margin-top:3px}
.hint.bad{color:var(--red)}
details{margin:10px 0;font-size:.82rem}
summary{cursor:pointer;color:var(--copper);font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:.72rem;letter-spacing:.08em}
pre{white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,.4);padding:8px;border:1px solid var(--border);max-height:260px;overflow:auto;font-size:.78rem}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-family:'Oswald',sans-serif;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--copper);font-weight:400}
td input[type=text],td select{padding:5px 6px;font-size:.82rem}
td input[type=checkbox]{accent-color:var(--red)}
#msg{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:var(--panel);border-left:4px solid var(--red);padding:10px 18px;font-family:'Oswald',sans-serif;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;display:none;z-index:50}
.empty{border:1px dashed var(--border);padding:22px;text-align:center;color:rgba(245,241,232,.6)}
.dropend{border:1px dashed var(--border);padding:10px;text-align:center;color:var(--bone-dim);font-size:.76rem;font-family:'Oswald',sans-serif;letter-spacing:.08em;text-transform:uppercase}
.dropend.over{border-color:var(--copper);color:var(--copper)}
footer{font-family:'Oswald',sans-serif;text-align:center;color:#555;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;padding:18px 10px 8px}
</style>
<script id="sq-logic">
(function (window) {
  'use strict';
  // Pure logic only. No document, no fetch, no localStorage in this block: it is extracted by
  // scripts/test-social-queue.mjs and run under node:test against a bare window object.
  var SQ_VERSION = '1.0';   // the contract's version constant; <meta name="wg-version"> and <title> carry the same string
  var SQ = {};
  SQ.VERSION = SQ_VERSION;
  SQ.BUCKET_URL = 'https://pcqoivjzcokgdtlvoona.supabase.co/storage/v1/object/public/social-media/';
  SQ.WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];                                   // slot chips
  SQ.WEEKDAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday']; // sentences (slotWhy)

  SQ.esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  SQ.pacificToday = function (now) {
    var d = now || new Date();
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
  };

  // D3: ordered line with pins. Pinned-for-today jumps the line; a pin whose date passed is
  // reported (stale_pins) and ordered as if unpinned. Killed and published are not in the line.
  SQ.orderLine = function (posts, today) {
    var live = (posts || []).filter(function (p) { return p.status === 'pending' || p.status === 'approved'; });
    var stale = [];
    live.forEach(function (p) { if (p.pinned_date && p.pinned_date < today) { stale.push(p.id); } });
    live.sort(function (a, b) {
      var ap = a.pinned_date === today ? 0 : 1, bp = b.pinned_date === today ? 0 : 1;
      if (ap !== bp) { return ap - bp; }
      var d = Number(a.line_order) - Number(b.line_order);
      if (d !== 0 && !isNaN(d)) { return d; }
      return String(a.id) < String(b.id) ? -1 : (String(a.id) > String(b.id) ? 1 : 0);
    });
    return { line: live, stale_pins: stale };
  };

  // Drag-reorder -> social_post_reorder(p_id, p_after_id). beforeId null = dropped at the end.
  // A card dropped on itself keeps its place (returns its own predecessor, or null at the front).
  SQ.reorderTarget = function (ids, draggedId, beforeId) {
    var all = ids || [];
    if (beforeId === draggedId) {                       // dropped on itself: keep its place
      var i = all.indexOf(draggedId);
      return i <= 0 ? null : all[i - 1];
    }
    var rest = all.filter(function (x) { return x !== draggedId; });
    if (beforeId == null) { return rest.length ? rest[rest.length - 1] : null; }
    var idx = rest.indexOf(beforeId);
    if (idx < 0) { return rest.length ? rest[rest.length - 1] : null; }
    if (idx === 0) { return null; }
    return rest[idx - 1];
  };

  SQ.fmtTime = function (t) {
    var m = /^(\d{1,2}):(\d{2})/.exec(String(t == null ? '' : t));
    if (!m) { return '?'; }
    var h = parseInt(m[1], 10), ap = h >= 12 ? 'PM' : 'AM', h12 = h % 12 || 12;
    return h12 + ':' + m[2] + ' ' + ap;
  };

  // The slot "why" popover, from slot_plan.evidence (contract: online_peak_hour,
  // online_mean_by_hour, tie_break, previous, shift_min).
  SQ.slotWhy = function (row) {
    if (!row) { return 'No plan yet.'; }
    var e = row.evidence || {}, parts = [];
    if (e.online_peak_hour != null) {
      // Full day name + 's' ("Mondays"); SQ.WEEKDAYS ('Mon') is for the chips only and would read "Mons".
      var dayName = SQ.WEEKDAY_NAMES[row.weekday] ? SQ.WEEKDAY_NAMES[row.weekday] + 's' : 'that day';
      parts.push('Followers online peak at ' + SQ.fmtTime(e.online_peak_hour + ':00') + ' on ' + dayName + ' (mean of the last 4).');
    }
    if (e.tie_break === 'reach') { parts.push('Tie within 5% broken by our own reach in that hour.'); }
    if (e.previous) {
      parts.push('Was ' + SQ.fmtTime(e.previous) + (e.shift_min ? ', moved ' + e.shift_min + ' min (max 30 a week).' : ', unchanged.'));
    }
    if (row.computed_at) { parts.push('Computed ' + String(row.computed_at).slice(0, 10) + '.'); }
    return parts.join(' ') || 'No evidence stored.';
  };

  SQ.daysOfApproved = function (line) {
    return (line || []).filter(function (p) { return p.status === 'approved'; }).length;
  };
  SQ.reviewCount = function (line) {
    var a = SQ.daysOfApproved(line), t = (line || []).length;
    return { approved: a, pending: t - a, total: t };
  };
  // D19: an empty approved line is a dark day; say so 3 days out.
  SQ.lineBanner = function (days) {
    if (days >= 3) { return ''; }
    if (days <= 0) { return 'NOTHING APPROVED. The next slot is a dark day until you approve something.'; }
    return days + ' approved day' + (days === 1 ? '' : 's') + ' left. Approve more or the feed goes dark in ' + days + '.';
  };

  SQ.ago = function (iso, now) {
    if (!iso) { return 'never'; }
    var t = new Date(iso).getTime(), n = (now || new Date()).getTime();
    if (isNaN(t)) { return 'never'; }
    var s = Math.max(0, Math.round((n - t) / 1000));
    if (s < 60) { return 'just now'; }
    if (s < 3600) { return Math.round(s / 60) + ' min ago'; }
    if (s < 86400) { return Math.round(s / 3600) + ' h ago'; }
    return Math.round(s / 86400) + ' d ago';
  };
  SQ.lastTick = function (runs, now) {
    var ticks = (runs || []).filter(function (r) { return r.action === 'due' || r.action === 'tick'; });
    ticks.sort(function (a, b) { return new Date(b.at).getTime() - new Date(a.at).getTime(); });
    if (!ticks.length) { return 'no cloud tick yet'; }
    return 'cloud tick ' + SQ.ago(ticks[0].at, now) + (ticks[0].outcome ? ' · ' + ticks[0].outcome : '');
  };

  SQ.mediaUrl = function (p) {
    var s = String(p == null ? '' : p);
    if (/^(https?:)?\/\//.test(s) || /^(renders|data|assets)\//.test(s)) { return s; }
    return SQ.BUCKET_URL + s.replace(/^\/+/, '');
  };
  SQ.pathFromUrl = function (u) {
    var s = String(u == null ? '' : u);
    return s.indexOf(SQ.BUCKET_URL) === 0 ? s.slice(SQ.BUCKET_URL.length) : s;
  };

  SQ.kindLabel = function (k) { return k ? String(k).replace(/_/g, ' ').toUpperCase() : '?'; };
  SQ.KILL_REASONS = ['wrong photo', 'caption', 'not this week', 'dupe', 'other'];

  // D5: three options + a blank. A radio picked and left alone is the machine's words; anything
  // John types or edits is his (and the server files it as a voice sample).
  SQ.captionChoice = function (options, pickedIndex, typed) {
    var text = String(typed == null ? '' : typed).trim();
    if (!text) { return null; }
    var opt = (pickedIndex != null && options && options[pickedIndex]) ? options[pickedIndex] : null;
    if (opt && text === String(opt.text || '').trim()) { return { text: text, author: 'machine', register: opt.register || null }; }
    return { text: text, author: 'john', register: null };
  };
  SQ.parseHashtags = function (raw) {
    var errors = [], tags = [], seen = {};
    String(raw == null ? '' : raw).split(/[\s,]+/).forEach(function (t) {
      if (!t) { return; }
      var tag = t.charAt(0) === '#' ? t : '#' + t;
      if (!/^#[A-Za-z0-9_]+$/.test(tag)) { errors.push('bad tag: ' + t); return; }
      var k = tag.toLowerCase();
      if (seen[k]) { return; }
      seen[k] = 1; tags.push(k);
    });
    if (tags.length > 5) { errors.push('max 5 hashtags (you have ' + tags.length + ')'); }
    return { tags: tags, errors: errors, ok: errors.length === 0 };
  };
  SQ.fullCaption = function (post) {
    var c = String((post && post.caption_final) || '').trim(), h = (post && post.hashtags) || [];
    return h.length ? c + '\n\n' + h.join(' ') : c;
  };
  // Voice hard lines (contract): no em dashes, no "shop", public copy says Wolf never John.
  // Used by saveCaption (Task 4) and the comment SEND button (Task 7). null = clean.
  SQ.voiceCheck = function (text) {
    var s = String(text == null ? '' : text);
    if (/—/.test(s)) { return 'No em dashes. Use a period or a comma.'; }
    if (/\s–\s/.test(s)) { return 'No dashes as punctuation. Use a period or a comma.'; }
    if (/\bshop\b/i.test(s)) { return 'Do not call it a shop. It is a garage or a community hub.'; }
    if (/\bJohn\b/.test(s)) { return 'Public copy says Wolf, never John.'; }
    return null;
  };

  window.SQ_VERSION = SQ_VERSION;
  window.SQ = SQ;
})(window);
</script>
</head>
<body>
<header>
  <div class="brand"><img src="assets/wolf-logo.png" alt="Wolf's Garage"><h1>WG <span>SOCIAL</span> QUEUE</h1></div>
  <button class="act" id="lockBtn" type="button">LOCK</button>
</header>
<div class="pin"></div>
<main>
  <div id="demoBar">DEMO DATA - nothing on this page is saved</div>
  <div class="strip" id="slots"></div>
  <div class="strip">
    <div class="stat" id="daysStat"><b>-</b> approved days</div>
    <div class="stat ok" id="lineStat"><b>-</b> in line</div>
    <div class="stat ok" id="liveStat"><b>-</b> live publishing</div>
    <button class="act" id="liveBtn" type="button" disabled>ARM LIVE</button>
    <div id="tick">loading</div>
  </div>
  <div id="banner"></div>
  <div class="tabs">
    <button class="tab on" data-tab="line" type="button">Line</button>
    <button class="tab" data-tab="handles" type="button">Handles</button>
    <button class="tab" data-tab="comments" type="button">Comments</button>
    <button class="tab" data-tab="runs" type="button">Runs</button>
  </div>
  <div class="pane on" id="paneLine"><div class="cols"><div id="lineCol"></div><div id="detailCol"></div></div></div>
  <div class="pane" id="paneHandles"><div id="tabHandles"></div></div>
  <div class="pane" id="paneComments"><div id="tabComments"></div></div>
  <div class="pane" id="paneRuns"><div id="tabRuns"></div></div>
</main>
<div class="pin"></div>
<footer>Wolf's Garage LLC · Portland, Oregon · social queue v1.0</footer>
<div id="msg"></div>
<script id="sq-app">
(function () {
  'use strict';
  var SQ = window.SQ;
  var SB = 'https://pcqoivjzcokgdtlvoona.supabase.co/rest/v1/rpc/';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjcW9pdmp6Y29rZ2R0bHZvb25hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4MjM3NzgsImV4cCI6MjA5NDM5OTc3OH0.yp8ypvsFewABuCjLpewEocY-8vBUjz6gmLLHofYTzbo';
  var FN = 'https://pcqoivjzcokgdtlvoona.supabase.co/functions/v1/wg-ig-publish';
  var DEMO = /[?&]demo=1/.test(location.search);
  var state = { tab: 'line', line: [], stale_pins: [], counts: {}, slot_plan: [], settings: {}, days: 0,
                runs: [], handles: [], comments: [], selectedId: null, storyStash: {}, demo: null,
                detailFor: null, captionPick: null, captionText: null, hashText: null };
  var $ = function (id) { return document.getElementById(id); };
  var esc = SQ.esc;

  // Same key as events-queue.html (events.admin_check); prompt on first use, LOCK clears.
  function key() {
    var k = localStorage.getItem('wgEvAdminKey');
    if (!k) { k = prompt('Events admin key (from your password manager / WG_EVENTS_ADMIN_KEY):') || ''; if (k) localStorage.setItem('wgEvAdminKey', k.trim()); }
    return (k || '').trim();
  }
  // Proxy write token for edge-function actions (upload, epic_request, comment_reply).
  // Contract key is wgProxyToken; post-queue.html stored it as wg:proxytok, so read that as a
  // fallback and migrate it so John does not paste it twice on the same laptop.
  function proxyTok() {
    var t = null;
    try { t = localStorage.getItem('wgProxyToken') || localStorage.getItem('wg:proxytok'); } catch (e) {}
    if (!t) {
      t = (prompt('One-time setup: paste the WG proxy write token (vault _secrets\\wg-proxy-token.txt)') || '').trim();
    }
    if (t) { try { localStorage.setItem('wgProxyToken', t); } catch (e2) {} }
    return t || '';
  }
  function toast(t) { var m = $('msg'); m.textContent = t; m.style.display = 'block'; setTimeout(function () { m.style.display = 'none'; }, 2600); }

  var WRITE_RPCS = { social_post_decide: 1, social_post_caption: 1, social_post_reorder: 1, social_post_pin: 1,
                     social_post_media: 1, social_post_upsert: 1, social_handle_upsert: 1, social_handle_delete: 1,
                     social_comment_set: 1, social_setting_set: 1 };
  function demoRpc(name, args) {
    var d = state.demo || {};
    if (WRITE_RPCS[name]) { toast('DEMO - nothing saved'); return Promise.resolve({ ok: true, demo: true }); }
    if (name === 'social_line') { return Promise.resolve(d.line || { ok: true, line: [] }); }
    if (name === 'social_runs') { return Promise.resolve(d.runs || []); }
    if (name === 'social_handles') { return Promise.resolve(d.handles || []); }
    if (name === 'social_comments') { return Promise.resolve(d.comments || []); }
    if (name === 'social_post_get') { return Promise.resolve(((d.line || {}).line || []).filter(function (p) { return p.id === args.p_id; })[0] || null); }
    return Promise.resolve({ ok: false, error: 'demo has no ' + name });
  }
  function rpc(name, args) {
    args = args || {};
    if (DEMO) { return demoRpc(name, args); }
    args.p_key = key();
    return fetch(SB + name, { method: 'POST', headers: { 'content-type': 'application/json', apikey: ANON, authorization: 'Bearer ' + ANON }, body: JSON.stringify(args) })
      .then(function (r) {
        if (r.status === 400 || r.status === 401 || r.status === 403) {
          return r.json().catch(function(){return {};}).then(function (e) {
            if (/unauthorized|admin_key/.test(JSON.stringify(e))) { localStorage.removeItem('wgEvAdminKey'); toast('Bad key - re-enter'); }
            throw new Error('rpc ' + name + ': ' + (e.message || e.error || ('http ' + r.status)));
          });
        }
        if (!r.ok) throw new Error('rpc ' + name + ': http ' + r.status);
        return r.json();
      });
  }
  // Edge function call. Never logs the body (it can carry base64 media); the reply is shown
  // verbatim by the caller where the contract says so (epic_request), after redact().
  function fnCall(action, body) {
    if (DEMO) { toast('DEMO - nothing sent'); return Promise.resolve({ status: 200, data: { ok: false, demo: true, action: action } }); }
    var tok = proxyTok();
    if (!tok) { return Promise.reject(new Error('no write token on this device')); }
    var payload = Object.assign({ action: action }, body || {});
    return fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: 'Bearer ' + ANON, 'x-wg-token': tok }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json().catch(function () { return null; }).then(function (data) { return { status: r.status, data: data }; }); });
  }
  function redact(s) { return String(s == null ? '' : s).replace(/access_token=[^&\s"]+/g, 'access_token=REDACTED').replace(/EAA[A-Za-z0-9]{20,}/g, 'EAA...REDACTED'); }

  document.getElementById('lockBtn').addEventListener('click', function () {
    localStorage.removeItem('wgEvAdminKey'); localStorage.removeItem('wgProxyToken'); localStorage.removeItem('wg:proxytok'); toast('Keys cleared');
  });

  function renderHeader() {
    var today = SQ.pacificToday(), dow = new Date(today + 'T12:00:00').getDay();
    var byDay = {};
    (state.slot_plan || []).forEach(function (r) { byDay[r.weekday] = r; });
    $('slots').innerHTML = SQ.WEEKDAYS.map(function (n, i) {
      var r = byDay[i];
      return '<div class="slot' + (i === dow ? ' today' : '') + '" data-day="' + i + '">' + n + '<b>' + (r ? SQ.fmtTime(r.slot_time) : '--') + '</b>' +
        '<div class="why">' + esc(SQ.slotWhy(r || null)) + '</div></div>';
    }).join('');
    var rc = SQ.reviewCount(state.line);
    var days = (state.days != null) ? state.days : SQ.daysOfApproved(state.line);
    $('daysStat').innerHTML = '<b>' + esc(days) + '</b> approved days';
    $('daysStat').className = 'stat' + (days >= 3 ? ' ok' : '');
    $('lineStat').innerHTML = '<b>' + rc.total + '</b> in line · ' + rc.approved + ' approved · ' + rc.pending + ' to review';
    var live = (state.settings || {}).live_publishing || 'off';
    $('liveStat').innerHTML = '<b>' + esc(live) + '</b> live publishing';
    $('liveStat').className = 'stat' + (live === 'on' ? '' : ' ok');
    $('tick').textContent = SQ.lastTick(state.runs, new Date());
    var b = SQ.lineBanner(days);
    var stale = (state.stale_pins || []).length ? ' · ' + state.stale_pins.length + ' pin' + (state.stale_pins.length === 1 ? '' : 's') + ' past date - unpinned in the order, fix the date or clear it' : '';
    $('banner').textContent = b + stale;
    $('banner').className = (b || stale) ? 'on' : '';
  }
  $('slots').addEventListener('click', function (ev) {
    var s = ev.target.closest('.slot'); if (!s) return;
    var open = s.classList.contains('open');
    document.querySelectorAll('.slot.open').forEach(function (x) { x.classList.remove('open'); });
    if (!open) s.classList.add('open');
  });

  function lineCard(p, i) {
    var today = SQ.pacificToday();
    var thumb = (p.media && p.media[0]) ? SQ.mediaUrl(p.media[0].path) : 'assets/wolf-logo.png';
    var pinnedToday = p.pinned_date === today;
    var stale = state.stale_pins.indexOf(p.id) >= 0;
    var chips = '<span class="chip ' + (p.status === 'approved' ? 'bone' : '') + '">' + esc(p.status) + '</span>';
    if (p.pinned_date) { chips += '<span class="chip' + (stale ? ' bad' : '') + '">' + (stale ? 'PIN PASSED ' : 'PIN ') + esc(p.pinned_date) + '</span>'; }
    if (p.caption_author === 'john') { chips += '<span class="chip dim">your words</span>'; }
    if (!p.caption_final) { chips += '<span class="chip bad">no caption</span>'; }
    if (p.story_media) { chips += '<span class="chip dim">story</span>'; }
    var cap = p.caption_final || ((p.caption_options || [])[0] || {}).text || '';
    return '<div class="card ' + esc(p.status) + (p.id === state.selectedId ? ' sel' : '') + '" data-id="' + esc(p.id) + '" draggable="' + (pinnedToday ? 'false' : 'true') + '">' +
      '<img src="' + esc(thumb) + '" alt="">' +
      '<div><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">' +
      '<div class="ct">' + (i + 1) + '. ' + esc(SQ.kindLabel(p.kind)) + (pinnedToday ? ' · TODAY' : '') + '</div>' +
      '<span class="handle" title="drag to reorder">&#8801;</span></div>' +
      '<div class="cm">' + esc(p.id) + ' · ' + ((p.media || []).length) + ' slide' + ((p.media || []).length === 1 ? '' : 's') + '</div>' +
      '<div>' + chips + '</div>' +
      '<div class="row" style="color:var(--bone-dim);font-size:.82rem">' + esc(cap.length > 110 ? cap.slice(0, 110) + '...' : cap) + '</div>' +
      '<div class="btns">' +
      (p.status === 'pending' ? '<button class="act primary" data-act="approve" data-id="' + esc(p.id) + '" type="button">POST IT</button>' : '<button class="act" data-act="unapprove" data-id="' + esc(p.id) + '" type="button" disabled>APPROVED</button>') +
      '<button class="act" data-act="edit" data-id="' + esc(p.id) + '" type="button">FIX IT</button>' +
      '<button class="act kill" data-act="kill" data-id="' + esc(p.id) + '" type="button">KILL IT</button>' +
      '</div>' +
      '<div class="btns" data-reasons="' + esc(p.id) + '" style="display:none">' + SQ.KILL_REASONS.map(function (r) {
        return '<button class="act kill" data-act="kill-reason" data-id="' + esc(p.id) + '" data-reason="' + esc(r) + '" type="button">' + esc(r) + '</button>';
      }).join('') + '<button class="act" data-act="kill-cancel" data-id="' + esc(p.id) + '" type="button">never mind</button></div>' +
      '</div></div>';
  }
  function renderLine() {
    if (!state.line.length) { $('lineCol').innerHTML = '<div class="empty">Line is empty. The builder tops it up to ' + esc((state.settings || {}).line_depth || 10) + ' overnight.</div>'; return; }
    $('lineCol').innerHTML = state.line.map(lineCard).join('') + '<div class="dropend">drop here to send to the back of the line</div>';
  }
  function decide(id, action, reason) {
    return rpc('social_post_decide', { p_id: id, p_action: action, p_reason: reason || null })
      .then(function () { toast(action === 'approve' ? 'Approved - in line' : (action === 'kill' ? 'Killed' : 'Back in line')); return loadLine(); })
      .catch(function (e) { toast('Failed: ' + e.message); });
  }
  function pinPost(id, date) {
    return rpc('social_post_pin', { p_id: id, p_date: date || null })
      .then(function () { toast(date ? 'Pinned to ' + date : 'Unpinned'); return loadLine(); })
      .catch(function (e) { toast('Pin failed: ' + e.message); });
  }
  function reorder(draggedId, beforeId) {
    var ids = state.line.map(function (p) { return p.id; });
    var after = SQ.reorderTarget(ids, draggedId, beforeId);
    return rpc('social_post_reorder', { p_id: draggedId, p_after_id: after })
      .then(function () { toast('Moved'); return loadLine(); })
      .catch(function (e) { toast('Reorder failed: ' + e.message); loadLine(); });
  }
  var dragId = null;
  function bindLineEvents() {
    var col = $('lineCol');
    col.addEventListener('click', function (ev) {
      var b = ev.target.closest('button.act');
      if (b) {
        var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
        if (act === 'approve') { b.disabled = true; decide(id, 'approve', 'approved on social-queue'); }
        else if (act === 'kill') { var r = col.querySelector('[data-reasons="' + id + '"]'); if (r) { r.style.display = r.style.display === 'none' ? 'flex' : 'none'; } }
        else if (act === 'kill-cancel') { var r2 = col.querySelector('[data-reasons="' + id + '"]'); if (r2) { r2.style.display = 'none'; } }
        else if (act === 'kill-reason') { b.disabled = true; decide(id, 'kill', b.getAttribute('data-reason')); }
        else if (act === 'edit') { select(id); var dc = $('detailCol'); if (dc.scrollIntoView) { dc.scrollIntoView({ behavior: 'smooth', block: 'start' }); } }
        return;
      }
      var card = ev.target.closest('.card'); if (card) { select(card.getAttribute('data-id')); }
    });
    col.addEventListener('dragstart', function (ev) {
      var card = ev.target.closest('.card'); if (!card || card.getAttribute('draggable') !== 'true') { ev.preventDefault(); return; }
      dragId = card.getAttribute('data-id'); card.classList.add('drag');
      try { ev.dataTransfer.setData('text/plain', dragId); ev.dataTransfer.effectAllowed = 'move'; } catch (e) {}
    });
    col.addEventListener('dragend', function () { dragId = null; col.querySelectorAll('.drag,.over').forEach(function (x) { x.classList.remove('drag'); x.classList.remove('over'); }); });
    col.addEventListener('dragover', function (ev) {
      var t = ev.target.closest('.card,.dropend'); if (!t || !dragId) return;
      ev.preventDefault(); try { ev.dataTransfer.dropEffect = 'move'; } catch (e) {}
      col.querySelectorAll('.over').forEach(function (x) { x.classList.remove('over'); }); t.classList.add('over');
    });
    col.addEventListener('dragleave', function (ev) { var t = ev.target.closest('.card,.dropend'); if (t) t.classList.remove('over'); });
    col.addEventListener('drop', function (ev) {
      var t = ev.target.closest('.card,.dropend'); if (!t || !dragId) return;
      ev.preventDefault();
      var beforeId = t.classList.contains('dropend') ? null : t.getAttribute('data-id');
      var id = dragId; dragId = null;
      if (beforeId === id) { return; }
      reorder(id, beforeId);
    });
  }
  bindLineEvents();

  function detailCaptionHtml(p) {
    var opts = p.caption_options || [];
    var pick = state.captionPick;
    var radios = opts.map(function (o, i) {
      return '<label class="opt"><input type="radio" name="capopt" value="' + i + '"' + (pick === i ? ' checked' : '') + '>' +
        '<span><span class="reg">' + esc(o.register || 'option ' + (i + 1)) + '</span>' + esc(o.text || '') + '</span></label>';
    }).join('');
    var current = (state.captionText != null) ? state.captionText : (p.caption_final || '');
    var hashRaw = (state.hashText != null) ? state.hashText : (p.hashtags || []).join(' ');
    var hv = SQ.parseHashtags(hashRaw);
    return '<div class="field"><label>Caption - pick one or write your own' + (p.caption_author ? ' · current: ' + esc(p.caption_author === 'john' ? 'your words' : 'machine') : ' · nothing chosen yet') + '</label>' +
      radios +
      '<textarea id="capText" placeholder="Or type it here. Plain words. No em dashes.">' + esc(current) + '</textarea>' +
      '<div class="hint">Facts the engine may use: ' + esc(Object.keys(p.facts || {}).filter(function (k) { var v = p.facts[k]; return v && String(v).length && k !== 'shoot_note'; }).map(function (k) { return k + '=' + (Array.isArray(p.facts[k]) ? p.facts[k].join('/') : p.facts[k]); }).join(' · ') || 'none') + '</div></div>' +
      '<div class="field"><label>Hashtags (0 to 5)</label><input type="text" id="hashText" value="' + esc(hashRaw) + '" placeholder="#wolfsgarage #pnwcars">' +
      '<div class="hint' + (hv.ok ? '' : ' bad') + '" id="hashHint">' + esc(hv.ok ? (hv.tags.length + ' tag' + (hv.tags.length === 1 ? '' : 's')) : hv.errors.join(' · ')) + '</div></div>' +
      '<div class="btns"><button class="act primary" data-act="use-caption" type="button">USE THIS</button>' +
      '<button class="act" data-act="reset-caption" type="button">RESET</button></div>';
  }
  function renderDetail() {
    var p = selected();
    if (!p) { $('detailCol').innerHTML = '<div class="empty">Pick a post on the left.</div>'; return; }
    if (state.detailFor !== p.id) { state.detailFor = p.id; state.captionPick = null; state.captionText = null; state.hashText = null; }
    var slides = (p.media || []).map(function (m, i) {
      return '<div class="slide"><img src="' + esc(SQ.mediaUrl(m.path)) + '" alt="slide ' + (i + 1) + '">' +
        '<span class="chip tier ' + (m.edit_tier === 'epic' ? 'bone' : '') + '">' + esc(m.edit_tier || 'raw') + '</span>' +
        '<div class="cm">slide ' + (i + 1) + ' · ' + esc(m.aspect || '') + ' · ' + esc(m.w || '?') + 'x' + esc(m.h || '?') + '</div>' +
        '<div class="btns" data-slidebtns="' + i + '"></div></div>';
    }).join('');
    $('detailCol').innerHTML = '<div class="detail">' +
      '<div class="ct">' + esc(SQ.kindLabel(p.kind)) + ' · ' + esc(p.id) + '</div>' +
      '<div class="cm">' + esc(p.status) + (p.pinned_date ? ' · pinned ' + esc(p.pinned_date) : '') + (p.facts && p.facts.event ? ' · ' + esc(p.facts.event) : '') + '</div>' +
      '<div class="slides" id="slides">' + (slides || '<div class="empty">No slides yet.</div>') + '</div>' +
      detailCaptionHtml(p) +
      '<div class="field"><label>Pin to a date (jumps the line that day)</label>' +
      '<div class="btns" style="margin-top:0"><input type="date" id="pinDate" style="width:auto" value="' + esc(p.pinned_date || '') + '">' +
      '<button class="act" data-act="pin" type="button">PIN</button><button class="act" data-act="unpin" type="button"' + (p.pinned_date ? '' : ' disabled') + '>UNPIN</button></div></div>' +
      '<div id="extras"></div>' +
      '</div>';
    renderExtras(p);
  }
  function renderExtras(p) { /* Task 5 */ }
  function saveCaption(p) {
    var choice = SQ.captionChoice(p.caption_options || [], state.captionPick, $('capText').value);
    if (!choice) { toast('Nothing to save - pick an option or type a caption'); return Promise.resolve(); }
    // Same gate as the comment SEND button: what John types is what posts, so the hard lines
    // (em dash / shop / John) are checked here too, not only on the machine side.
    var bad = SQ.voiceCheck(choice.text);
    if (bad) { toast(bad); return Promise.resolve(); }
    var hv = SQ.parseHashtags($('hashText').value);
    if (!hv.ok) { toast(hv.errors[0]); return Promise.resolve(); }
    return rpc('social_post_caption', { p_id: p.id, p_text: choice.text, p_author: choice.author, p_hashtags: hv.tags })
      .then(function () { toast(choice.author === 'john' ? 'Saved your words (voice sample filed)' : 'Saved option: ' + (choice.register || 'machine')); state.captionText = null; state.hashText = null; return loadLine(); })
      .catch(function (e) { toast('Save failed: ' + e.message); });
  }
  function bindDetailEvents() {
    var col = $('detailCol');
    col.addEventListener('change', function (ev) {
      var p = selected(); if (!p) return;
      if (ev.target.name === 'capopt') {
        state.captionPick = parseInt(ev.target.value, 10);
        var o = (p.caption_options || [])[state.captionPick];
        $('capText').value = o ? (o.text || '') : ''; state.captionText = $('capText').value;
      }
    });
    col.addEventListener('input', function (ev) {
      if (ev.target.id === 'capText') { state.captionText = ev.target.value; }
      if (ev.target.id === 'hashText') {
        state.hashText = ev.target.value;
        var hv = SQ.parseHashtags(ev.target.value);
        $('hashHint').className = 'hint' + (hv.ok ? '' : ' bad');
        $('hashHint').textContent = hv.ok ? (hv.tags.length + ' tag' + (hv.tags.length === 1 ? '' : 's')) : hv.errors.join(' · ');
      }
    });
    col.addEventListener('click', function (ev) {
      var b = ev.target.closest('button.act'); if (!b) return;
      var p = selected(); if (!p) return;
      var act = b.getAttribute('data-act');
      if (act === 'use-caption') { b.disabled = true; saveCaption(p).then(function () { b.disabled = false; }); }
      else if (act === 'reset-caption') { state.captionPick = null; state.captionText = null; state.hashText = null; renderDetail(); }
      else if (act === 'pin') { var d = $('pinDate').value; if (!d) { toast('Pick a date first'); return; } if (d < SQ.pacificToday()) { toast('That date already passed'); return; } pinPost(p.id, d); }
      else if (act === 'unpin') { pinPost(p.id, null); }
      else if (extrasClick) { extrasClick(p, b, act); }
    });
  }
  var extrasClick = null;   // Task 5 assigns a handler for the tags / story / epic / drop-in / packet buttons
  bindDetailEvents();

  // Filled in by Tasks 6-8.
  function renderHandles() { $('tabHandles').innerHTML = '<div class="empty">Handles: Task 6.</div>'; }
  function renderComments() { $('tabComments').innerHTML = '<div class="empty">Comments: Task 7.</div>'; }
  function renderRuns() { $('tabRuns').innerHTML = '<div class="empty">Runs: Task 8.</div>'; }

  function select(id) { state.selectedId = id; renderLine(); renderDetail(); }
  function selected() { return state.line.filter(function (p) { return p.id === state.selectedId; })[0] || null; }

  function loadLine() {
    return rpc('social_line', {}).then(function (d) {
      var o = SQ.orderLine(d.line || [], SQ.pacificToday());
      state.line = o.line; state.stale_pins = o.stale_pins;
      state.counts = d.counts || {}; state.slot_plan = d.slot_plan || []; state.settings = d.settings || {};
      state.days = (d.days_of_approved != null) ? d.days_of_approved : SQ.daysOfApproved(o.line);
      if (!selected() && state.line.length) { state.selectedId = state.line[0].id; }
      return rpc('social_runs', { p_limit: 10 }).then(function (r) { state.runs = Array.isArray(r) ? r : (r.runs || []); }).catch(function () {});
    }).then(function () { renderHeader(); if (state.tab === 'line') { renderLine(); renderDetail(); } })
      .catch(function (e) { $('lineCol').innerHTML = '<div class="empty">Load failed: ' + esc(e.message) + '</div>'; $('tick').textContent = 'load failed'; });
  }
  function refresh() {
    if (state.tab === 'handles') { return renderHandles(); }
    if (state.tab === 'comments') { return renderComments(); }
    if (state.tab === 'runs') { return renderRuns(); }
    return loadLine();
  }
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('on'); });
      document.querySelectorAll('.pane').forEach(function (x) { x.classList.remove('on'); });
      t.classList.add('on'); state.tab = t.getAttribute('data-tab');
      $('pane' + state.tab.charAt(0).toUpperCase() + state.tab.slice(1)).classList.add('on');
      refresh();
    });
  });

  function boot() {
    if (DEMO) {
      $('demoBar').className = 'on';
      fetch('data/social-queue-demo.json').then(function (r) { return r.json(); }).then(function (d) { state.demo = d; loadLine(); })
        .catch(function (e) { $('lineCol').innerHTML = '<div class="empty">Demo fixture failed: ' + esc(e.message) + '</div>'; });
    } else { loadLine(); }
    // Contract: "Reads social_line on load and every 60 s". Every tab: the header strip (approved
    // days, live flag, cloud tick) must not go stale while John is on HANDLES / COMMENTS / RUNS.
    // loadLine() only re-renders the line and detail columns when state.tab === 'line'.
    setInterval(loadLine, 60000);
  }
  boot();
  console.log('WG Social Queue v' + window.SQ_VERSION + (DEMO ? ' (demo data, read-only)' : ''));
})();
</script>
</body>
</html>
